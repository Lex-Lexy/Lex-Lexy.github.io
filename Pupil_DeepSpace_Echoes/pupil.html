<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>瞳 · PUPIL / 深空回响</title><link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/controls.css"><link rel="stylesheet" href="css/interface.css"></head><body>
<canvas id="game"></canvas>
<div id="panel" class="collapsed">
  <div class="panelHeader"><span>设 置</span><button id="panelClose">−</button></div>
  <div class="row"><span class="label">敌速</span><input type="range" id="speedSlider" min="0.3" max="1.6" step="0.05" value="1.0"><span class="val" id="speedVal">1.00×</span></div>
  <div class="row"><span class="label">伤害</span><input type="range" id="dmgSlider" min="0.2" max="2.5" step="0.05" value="1.0"><span class="val" id="dmgVal">1.00×</span></div>
  <div class="row"><span class="label">范围</span><input type="range" id="rangeSlider" min="0.4" max="2.0" step="0.05" value="1.0"><span class="val" id="rangeVal">1.00×</span></div>
  <div class="row"><span class="label">尾阻</span><input type="range" id="trailSlider" min="0.3" max="2.5" step="0.05" value="1.0"><span class="val" id="trailVal">1.00×</span></div>
  <div class="row"><span class="label">敌方</span><div class="btnGroup"><button id="btnAuto" class="tbtn">自动</button><button id="btnManual" class="tbtn on">手动</button></div></div>
  <div class="row"><span class="label">按钮</span><div class="btnGroup"><button id="btnTouchOn" class="tbtn on">显示</button><button id="btnTouchOff" class="tbtn">隐藏</button></div></div>
</div>
<div id="panelToggle">⚙</div>
<div id="pauseBtn" class="hidden">⏸</div>
<div id="touchVBtn" class="hidden">V</div>
<div id="touchEBtn" class="hidden">E</div>
<div id="touchFBtn" class="hidden">F</div>
<div id="touchKBtn" class="hidden">]</div>
<div id="shadowBtn">B</div>
<div id="charBtn">[</div>
<div id="skillBtn">P</div>
