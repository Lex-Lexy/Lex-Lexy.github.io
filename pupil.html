    wanderAngle:Math.random()*Math.PI*2, wanderTimer:Math.random()*5,
    connectProgress:0, boostActive:0, holes,
    attached:false, attachOb:null, attachAngle:0, attachTimer:0,
    attachDir:Math.random()<0.5?1:-1, hypnotized:0, inVortex:false,
    shrine: false,
    immovable: false,
    wallHomeX: undefined, wallHomeY: undefined, wallRadius: 0,
    floating: false
  }, extra || {});
}
function generateSnails(refX, refY, eS){
  snails.length = 0;
  for (const sp of buildingSnailSpots){
    snails.push(makeSnailData(sp.x, sp.y, {
      shrine: !!sp.shrine,
      immovable: !!sp.immovable,
      wallHomeX: sp.wallHomeX,
      wallHomeY: sp.wallHomeY,
      wallRadius: sp.wallRadius || 0,
      attached: false
    }));
  }
  const nearCount = 1 + Math.floor(Math.random() * 2);
  let placedNear = 0, tries = 0;
  while (placedNear < nearCount && tries < 800){
    tries++;
    const a = Math.random()*Math.PI*2, d = 380 + Math.random()*300;
    const x = refX + Math.cos(a)*d, y = refY + Math.sin(a)*d;
    if (x < 220 || x > WORLD-220 || y < 220 || y > WORLD-220) continue;
    if (Math.hypot(x-eS.x, y-eS.y) < 520) continue;
    let ok = true;
    for (const o of obstacles) if (Math.hypot(x-o.x, y-o.y) < o.r + SNAIL_RADIUS + 28){ ok=false; break; }
    if (!ok) continue;
    for (const s of snails) if (Math.hypot(x-s.x, y-s.y) < 300){ ok=false; break; }
    if (!ok) continue;
    snails.push(makeSnailData(x, y)); placedNear++;
  }
  tries = 0;
  while (snails.length < SNAIL_COUNT && tries < 24000){
    tries++;
    const x = 260 + Math.random()*(WORLD-520), y = 260 + Math.random()*(WORLD-520);
    if (Math.hypot(x-refX, y-refY) < 300) continue;
    if (Math.hypot(x-eS.x, y-eS.y) < 400) continue;
    let ok = true;
    for (const o of obstacles) if (Math.hypot(x-o.x, y-o.y) < o.r + SNAIL_RADIUS + 28){ ok=false; break; }
    if (!ok) continue;
    for (const s of snails) if (Math.hypot(x-s.x, y-s.y) < 320){ ok=false; break; }
    if (!ok) continue;
    snails.push(makeSnailData(x, y));
  }
  for (const s of snails){
    if (s.shrine || s.immovable || s.floating) continue;
    if (s.wallHomeX !== undefined) continue;
    let bestOb = null, bestD = 1e9;
    for (const ob of obstacles){
      if (ob.type === 'membrane') continue;
      const d = Math.hypot(s.x-ob.x, s.y-ob.y) - ob.r;
      if (d < bestD){ bestD = d; bestOb = ob; }
    }
    if (bestOb && bestD < SNAIL_ATTACH_RANGE*1.5 && Math.random() < 0.78){
      s.attached = true; s.attachOb = bestOb;
      s.attachAngle = Math.atan2(s.y - bestOb.y, s.x - bestOb.x);
      s.attachTimer = 12 + Math.random()*18;
    }
  }
  if (currentMapDef && currentMapDef.night){
    const fx = 400 + Math.random()*(WORLD-800);
    const fy = 400 + Math.random()*(WORLD-800);
    snails.push(makeSnailData(fx, fy, { floating: true }));
  }
}

function addTrail(x, y, amount, vx, vy, noMerge, isPlayerSkill, isPurple){
  if (!noMerge){
    let best = null, bestD = MERGE_R2;
    for (const p of trails){
      const dx = p.x-x, dy = p.y-y;
      const d2 = dx*dx + dy*dy;
      if (d2 < bestD){ bestD = d2; best = p; }
    }
    if (best){ best.i = Math.min(TRAIL_MAX_I, best.i + amount*0.55); return; }
  }
  trails.push({ x, y, i:amount, born:time, vx:vx||0, vy:vy||0, isPlayerSkill: !!isPlayerSkill, isBurning:false, isFrost:false, isPurple: !!isPurple });
  if (trails.length > 2600) trails.splice(0, 240);
}
function spawnTrails(dt){
  const sp = Math.hypot(player.vx, player.vy);
  if (sp < 20){
    idleSpawnTimer += dt;
    const INTERVAL = 0.12;
    let guard = 0;
    while (idleSpawnTimer > INTERVAL && guard++ < 4){
      idleSpawnTimer -= INTERVAL;
      const a = Math.random()*Math.PI*2, rad = Math.random()*12;
      addTrail(player.x+Math.cos(a)*rad, player.y+Math.sin(a)*rad, 0.45);
    }
    lastSpawn.x = player.x; lastSpawn.y = player.y;
    return;
  }
  idleSpawnTimer = 0;
  let dx = player.x - lastSpawn.x, dy = player.y - lastSpawn.y;
  let d = Math.hypot(dx, dy);
  let guard = 0;
  while (d >= TRAIL_STEP && guard++ < 80){
    const t = TRAIL_STEP/d;
    lastSpawn.x += dx*t; lastSpawn.y += dy*t;
    addTrail(lastSpawn.x, lastSpawn.y, 0.55);
    dx = player.x - lastSpawn.x; dy = player.y - lastSpawn.y;
    d = Math.hypot(dx, dy);
  }
}
function spawnYinTrails(dt){
  if (player.charType !== 'yin') return;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp < 40) return;
  player.yinTrailTimer -= dt;
  if (player.yinTrailTimer > 0) return;
  player.yinTrailTimer = 0.035;
  const ux = player.vx/sp, uy = player.vy/sp;
  const baseA = Math.atan2(-uy, -ux);
  for (let i = 0; i < 3; i++){
    const spread = (Math.random() - 0.5)*0.85;
    const a = baseA + spread;
    const d = 8 + Math.random()*34;
    const spd = 70 + Math.random()*130;
    addTrail(player.x + Math.cos(a)*d, player.y + Math.sin(a)*d,
             1.1+Math.random()*0.7, Math.cos(a)*spd, Math.sin(a)*spd, true);
  }
}
function decayTrails(dt){
  let w = 0;
  for (const p of trails){
    p.i -= TRAIL_DECAY*dt;
    if (p.vx || p.vy){
      p.x += p.vx*dt; p.y += p.vy*dt;
      const damp = Math.exp(-1.15*dt);
      p.vx *= damp; p.vy *= damp;
      if (Math.abs(p.vx) < 1) p.vx = 0;
      if (Math.abs(p.vy) < 1) p.vy = 0;
    }
    if (p.isBurning){ p.burnTimer -= dt; if (p.burnTimer <= 0) p.isBurning = false; }
    if (p.isFrost){ p.frostTimer -= dt; if (p.frostTimer <= 0) p.isFrost = false; }
    if (p.isPurple){ p.purpleTimer -= dt; if (p.purpleTimer <= 0) p.isPurple = false; }
    if (p.isSpark){ p.sparkTimer -= dt; if (p.sparkTimer <= 0) p.i = 0; }
    if (p.i > 0.002) trails[w++] = p;
  }
  trails.length = w;
}

/* ============================== M. Rendering ============================ */
function drawBackgroundScreenSpace(){
  const theme = currentMapDef.theme;
  const px = -cam.cx*0.35, py = -cam.cy*0.35;
  const scaleNeb = 0.5 + cam.zoom*0.5;
  const scaleStar = 0.7 + cam.zoom*0.5;
  ctx.globalCompositeOperation = 'lighter';
  const nebCol = theme.accentDim;
  for (const n of nebulas){
    let sx = ((n.x + px) % NEB_WRAP + NEB_WRAP) % NEB_WRAP;
    let sy = ((n.y + py) % NEB_WRAP + NEB_WRAP) % NEB_WRAP;
    const nr = n.r*scaleNeb;
    sx -= nr*0.3; sy -= nr*0.3;
    if (sx < -nr*2 || sx > W+nr*2 || sy < -nr*2 || sy > H+nr*2) continue;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, nr);
    g.addColorStop(0, `rgba(${nebCol},${n.a*1.5})`);
    g.addColorStop(1, `rgba(${nebCol},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, nr, 0, Math.PI*2); ctx.fill();
  }
  for (const s of stars){
    let sx = ((s.x + px) % STAR_WRAP + STAR_WRAP) % STAR_WRAP;
    let sy = ((s.y + py) % STAR_WRAP + STAR_WRAP) % STAR_WRAP;
    if (sx < -4 || sx > W+4 || sy < -4 || sy > H+4) continue;
    const tw = 0.65 + 0.35*Math.sin(time*1.6 + s.p);
    ctx.globalAlpha = s.a*tw;
    ctx.fillStyle = `rgb(${theme.accent})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.r*scaleStar, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawBoundsWorld(){
  const theme = currentMapDef.theme;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${theme.accent},0.32)`;
  ctx.lineWidth = 3/cam.zoom;
  ctx.shadowBlur = 30; ctx.shadowColor = `rgba(${theme.accent},0.75)`;
  ctx.strokeRect(0, 0, WORLD, WORLD);
  ctx.restore();
}

function drawStoneBody(ob, fogActive, tint, glowCol, edgeLight){
  const N = 18;
  ctx.beginPath();
  for (let j=0; j<=N; j++){
    const a = j/N*Math.PI*2;
    const wob = 1 + Math.sin(a*4+ob.seed)*0.06 + Math.cos(a*7-ob.seed*0.7)*0.035 + Math.sin(a*11+ob.seed*1.3)*0.02;
    const rr = ob.r*wob;
    const px = ob.x + Math.cos(a)*rr, py = ob.y + Math.sin(a)*rr;
    if (j===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const rg = ctx.createRadialGradient(ob.x-ob.r*0.32, ob.y-ob.r*0.38, ob.r*0.05, ob.x, ob.y, ob.r*1.05);
  rg.addColorStop(0.00, tint[0]);
  rg.addColorStop(0.45, tint[1]);
  rg.addColorStop(0.85, tint[2]);
  rg.addColorStop(1.00, '#000');
  ctx.globalAlpha = fogActive ? 0.4 : 1;
  ctx.fillStyle = rg; ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  if (edgeLight > 0){
    ctx.strokeStyle = glowCol;
    ctx.lineWidth = 1.4 + edgeLight * 2.2;
    ctx.shadowBlur = 8 + edgeLight * 18;
    ctx.shadowColor = glowCol;
  } else {
    ctx.strokeStyle = glowCol;
    ctx.lineWidth = 1.6;
    ctx.shadowBlur = 0;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* 长板：一体化胶囊 */
function drawPlankGroup(ob, fogActive, edgeLight){
  const cx = ob.plankCX, cy = ob.plankCY;
  const a = ob.plankAngle;
  const hx = Math.cos(a) * ob.plankHalfLen;
  const hy = Math.sin(a) * ob.plankHalfLen;
  const x1 = cx - hx, y1 = cy - hy;
  const x2 = cx + hx, y2 = cy + hy;
  const w = ob.plankWidth * 2;
  const theme = currentMapDef.theme;

  ctx.save();
  ctx.globalAlpha = fogActive ? 0.5 : 1;
  ctx.lineCap = 'round';

  // 外层边缘光晕
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${theme.accent},${0.35 + edgeLight*0.55})`;
  ctx.lineWidth = w + 6;
  ctx.shadowBlur = 8 + edgeLight * 18;
  ctx.shadowColor = `rgba(${theme.accent},0.9)`;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.shadowBlur = 0;

  // 主体（深石）
  ctx.globalCompositeOperation = 'source-over';
  const gradPerp = ctx.createLinearGradient(
    cx + Math.cos(a + Math.PI/2) * ob.plankWidth,
    cy + Math.sin(a + Math.PI/2) * ob.plankWidth,
    cx - Math.cos(a + Math.PI/2) * ob.plankWidth,
    cy - Math.sin(a + Math.PI/2) * ob.plankWidth
  );
  gradPerp.addColorStop(0, '#0a1020');
  gradPerp.addColorStop(0.35, '#3a4a5e');
  gradPerp.addColorStop(0.65, '#2a3648');
  gradPerp.addColorStop(1, '#0a1020');
  ctx.strokeStyle = gradPerp;
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  // 内层高光
  ctx.strokeStyle = 'rgba(180,200,230,0.18)';
  ctx.lineWidth = w * 0.35;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  // 石纹（横向细线）
  ctx.strokeStyle = `rgba(${theme.accent},0.35)`;
  ctx.lineWidth = 1.2;
  const nx = Math.cos(a + Math.PI/2), ny = Math.sin(a + Math.PI/2);
  for (let k = -1; k <= 1; k++){
    if (k === 0) continue;
    const off = k * ob.plankWidth * 0.5;
    ctx.beginPath();
    ctx.moveTo(x1 + nx*off, y1 + ny*off);
    ctx.lineTo(x2 + nx*off, y2 + ny*off);
    ctx.stroke();
  }

  // 边缘描边
  ctx.strokeStyle = `rgba(${theme.accent},0.55)`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  ctx.restore();
}

/* 危墙：一体化内质网 */
function drawWallGroup(ob, fogActive, edgeLight){
  const cx = ob.wallCenterX, cy = ob.wallCenterY;
  const baseAngle = ob.wallBaseAngle;
  const arcSpan = ob.wallArcSpan;
  const layers = [148, 110, 74, 42];
  const startA = baseAngle - arcSpan/2;
  const endA = baseAngle + arcSpan/2;
  const theme = currentMapDef.theme;

  ctx.save();
  ctx.globalAlpha = fogActive ? 0.5 : 1;
  ctx.lineCap = 'round';

  // 外层光晕
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(160,120,90,${0.3 + edgeLight*0.6})`;
  ctx.lineWidth = 42;
  ctx.shadowBlur = 8 + edgeLight * 16;
  ctx.shadowColor = 'rgba(160,120,90,0.9)';
  for (let li = 0; li < layers.length; li++){
    ctx.beginPath(); ctx.arc(cx, cy, layers[li], startA, endA); ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // 每一层画粗弧
  ctx.globalCompositeOperation = 'source-over';
  const tints = ['#3a3430','#302a26','#282420','#22201c'];
  for (let li = 0; li < layers.length; li++){
    const R = layers[li];
    // 主体
    ctx.strokeStyle = tints[li];
    ctx.lineWidth = 32;
    ctx.beginPath(); ctx.arc(cx, cy, R, startA, endA); ctx.stroke();
    // 内高光
    ctx.strokeStyle = 'rgba(200,180,160,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, R - 11, startA, endA); ctx.stroke();
    // 上沿
    ctx.strokeStyle = 'rgba(255,220,180,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R + 12, startA, endA); ctx.stroke();
  }

  // 层间径向勾连（画成纤维状细线）
  for (let li = 0; li < layers.length - 1; li++){
    const r1 = layers[li], r2 = layers[li+1];
    const midR = (r1 + r2) / 2;
    const connectors = 3 + (li % 2);
    for (let c = 0; c < connectors; c++){
      const t = (c + 0.5) / connectors;
      const a = baseAngle + (t - 0.5) * arcSpan * 0.85;
      const x1 = cx + Math.cos(a) * r1;
      const y1 = cy + Math.sin(a) * r1;
      const x2 = cx + Math.cos(a) * r2;
      const y2 = cy + Math.sin(a) * r2;
      // 主体
      ctx.strokeStyle = '#2a2420';
      ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      // 中线高光
      ctx.strokeStyle = 'rgba(180,160,140,0.22)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  ctx.restore();
}

function drawObstaclesWorld(){
  const theme = currentMapDef.theme;
  const fogActive = (player.fogTimer > 0 || player.blindTimer > 0);
  const isNight = !!currentMapDef.night;
  const drawnGroups = new Set();

  for (const ob of obstacles){
    const pad = ob.r + 90;
    if (ob.x < view.l-pad || ob.x > view.r+pad || ob.y < view.t-pad || ob.y > view.b+pad) continue;

    let edgeLight = 0;
    if (isNight){
      const dP = Math.hypot(player.x-ob.x, player.y-ob.y);
      const dE = Math.hypot(enemy.x-ob.x, enemy.y-ob.y);
      const range = 340;
      const lp = Math.max(0, 1 - dP/range);
      const le = Math.max(0, 1 - dE/range) * 0.6;
      edgeLight = Math.max(lp, le);
    }

    if (ob.type === 'plank'){
      if (ob.plankKey !== undefined){
        if (drawnGroups.has('P'+ob.plankKey)) continue;
        drawnGroups.add('P'+ob.plankKey);
      }
      drawPlankGroup(ob, fogActive, edgeLight);
      continue;
    }
    if (ob.type === 'wall'){
      if (ob.wallKey !== undefined){
        if (drawnGroups.has('W'+ob.wallKey)) continue;
        drawnGroups.add('W'+ob.wallKey);
      }
      drawWallGroup(ob, fogActive, edgeLight);
      continue;
    }
    if (ob.type === 'shrine'){
      drawStoneBody(ob, fogActive, ['#4a4248','#2a242c','#0c0810'], 'rgba(255,220,150,0.6)', edgeLight);
      continue;
    }
    if (ob.type === 'altar'){
      drawStoneBody(ob, fogActive, ['#6a5a3a','#3a2e1c','#0a0604'], 'rgba(255,220,120,0.9)', edgeLight);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const amp = isNight ? 1 : 0.7;
      const pu = 0.5 + 0.5*Math.sin(time*2.2);
      ctx.strokeStyle = `rgba(255,220,120,${(0.4 + pu*0.5) * amp})`;
      ctx.lineWidth = 2.2;
      ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(255,220,120,0.95)';
      ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r*0.7, 0, Math.PI*2); ctx.stroke();
      if (isNight){
        const gg = ctx.createRadialGradient(ob.x, ob.y, 0, ob.x, ob.y, ob.r * 3);
        gg.addColorStop(0, `rgba(255,240,180,${0.35 + pu*0.20})`);
        gg.addColorStop(0.5, `rgba(255,220,120,${0.12 + pu*0.08})`);
        gg.addColorStop(1, 'rgba(255,200,80,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r*3, 0, Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
      continue;
    }

    if (ob.type === 'rock'){
      const N = 20;
      ctx.beginPath();
      for (let j=0; j<=N; j++){
        const a = j/N*Math.PI*2;
        const wob = 1 + Math.sin(a*4+ob.seed)*0.055 + Math.cos(a*7-ob.seed*0.7)*0.032 + Math.sin(a*11+ob.seed*1.3)*0.018;
        const rr = ob.r*wob;
        const px = ob.x + Math.cos(a)*rr, py = ob.y + Math.sin(a)*rr;
        if (j===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const rg = ctx.createRadialGradient(ob.x-ob.r*0.32, ob.y-ob.r*0.38, ob.r*0.05, ob.x, ob.y, ob.r*1.05);
      rg.addColorStop(0.00, theme.obstacle[0]);
      rg.addColorStop(0.45, theme.obstacle[1]);
      rg.addColorStop(0.85, theme.obstacle[2]);
      rg.addColorStop(1.00, '#000');
      ctx.globalAlpha = fogActive ? 0.3 : 1;
      ctx.fillStyle = rg; ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      if (edgeLight > 0){
        ctx.strokeStyle = `rgba(${theme.accent},${0.4 + edgeLight*0.6})`;
        ctx.lineWidth = 1.6 + edgeLight*2;
        ctx.shadowBlur = 6 + edgeLight*18;
        ctx.shadowColor = `rgba(${theme.accent},0.9)`;
      } else {
        ctx.strokeStyle = theme.obstacle[3];
        ctx.lineWidth = 1.6;
        ctx.shadowBlur = 0;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      ctx.globalCompositeOperation = 'lighter';
      const mg = ctx.createRadialGradient(ob.x, ob.y, ob.r*0.25, ob.x, ob.y, ob.r);
      mg.addColorStop(0.00, `rgba(${theme.accent},0.015)`);
      mg.addColorStop(0.72, `rgba(${theme.accent},0.10)`);
      mg.addColorStop(0.93, `rgba(${theme.accent},0.26)`);
      mg.addColorStop(1.00, `rgba(${theme.accent},0)`);
      ctx.globalAlpha = fogActive ? 0.25 : 1;
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(ob.x, ob.y, ob.r * 0.94, 0, Math.PI*2);
      const col = `rgba(${theme.accent},0.5)`;
      setSoftDash(col, [4, 8], -time*18, 1.4/Math.max(0.4, cam.zoom), 10);
      ctx.stroke();
      clearSoftDash();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

function drawSnail(s){
  const p = s.connectProgress, hyp = s.hypnotized;
  const isNight = !!currentMapDef.night;
  const nightDim = isNight && p <= 0.01 && !s.hypnotized && !s.shrine && !s.floating;

  let r, g, b;
  if (hyp > 0.01){
    const hr = 60 + hyp*40, hg = 8 + hyp*8, hb = 20 + hyp*20;
    r = Math.round((150 + p*105)*(1-hyp) + hr*hyp);
    g = Math.round((110 + p*140)*(1-hyp) + hg*hyp);
    b = Math.round((18 + p*80)*(1-hyp) + hb*hyp);

    g2.addColorStop(0.5, `rgba(255,220,120,${0.3 * pulse})`);
    g2.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = g2;

  }

                  + Math.cos(a*5 + s.phase*0.7 + time*0.35)*0.05
                  + Math.sin(a*8 - time*0.8 + s.bob)*0.03;

  for (let i=0; i<pts.length; i++){
    if (i===0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
  const bg = ctx.createRadialGradient(-SNAIL_RADIUS*0.28, -SNAIL_RADIUS*0.40, SNAIL_RADIUS*0.1, 0, 0, SNAIL_RADIUS*1.1);
  bg.addColorStop(0.00, `rgba(${Math.min(255,r+50)},${Math.min(255,g+50)},${Math.min(255,b+50)},1)`);
  bg.addColorStop(0.40, `rgba(${r},${g},${b},1)`);
  bg.addColorStop(0.78, `rgba(${Math.max(40,r-60)},${Math.max(20,g-60)},${b},1)`);
  bg.addColorStop(1.00, `rgba(${Math.max(20,r-100)},${Math.max(10,g-80)},${b},1)`);
  ctx.fillStyle = bg; ctx.fill();
  for (const h of s.holes){
    const pulse = 1 + Math.sin(time*1.1 + h.phase)*0.14;
    const hr = h.r*pulse;
    const hg2 = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, hr);
    hg2.addColorStop(0.00, `rgba(20,10,4,${0.85 - p*0.20 + hyp*0.1})`);
    hg2.addColorStop(0.55, `rgba(60,40,10,${0.40 - p*0.12})`);
    hg2.addColorStop(1.00, `rgba(100,80,26,0)`);
    ctx.fillStyle = hg2; ctx.beginPath(); ctx.arc(h.x, h.y, hr, 0, Math.PI*2); ctx.fill();
  }
  if (!nightDim){
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0; i<8; i++){
      const seed = i*43.7;
      const a = seed + time*0.10;
      const rr = SNAIL_RADIUS*(0.42 + 0.40*Math.sin(seed*1.3));
      const bx = Math.cos(a)*rr, by = Math.sin(a)*rr;
      const bs = 2.6 + Math.sin(time*1.4+seed)*1.3;

    if (i===0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);

  ctx.strokeStyle = `rgba(${r},${g},${b},${0.45+p*0.42})`;
  ctx.lineWidth = 1.5 + p*0.8; ctx.stroke();
  if (p > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${r},${g},60,${0.25+p*0.65})`;

    ctx.shadowBlur = 0;
  }
  if (attached && hyp < 0.5){
    ctx.globalCompositeOperation = 'lighter';
    const padGrad = ctx.createRadialGradient(0, SNAIL_RADIUS*0.7, 0, 0, SNAIL_RADIUS*0.7, SNAIL_RADIUS*0.75);

    ctx.beginPath();

    setSoftDash(col, [5, 8], -time*40, 2, 12);
    ctx.beginPath(); ctx.arc(0, 0, SNAIL_RADIUS*1.65, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
  }
  if (hyp > 0.15){
    ctx.globalCompositeOperation = 'lighter';
    const a = hyp * (0.5 + 0.5*Math.sin(time*2.6));
    const col = `rgba(180,20,60,${a*0.8})`;
    setSoftDash(col, [5, 8], -time*20, 2, 12);
    ctx.beginPath(); ctx.arc(0, 0, SNAIL_RADIUS*1.75, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
  }
  if (s.shrine && hyp < 0.5){
    ctx.globalCompositeOperation = 'lighter';
    const pu = 0.5 + 0.5*Math.sin(time*2.6);
    ctx.strokeStyle = `rgba(255,230,150,${0.5 + pu*0.4})`;
    ctx.lineWidth = 2.2;
    ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(255,230,150,0.9)';
    ctx.beginPath(); ctx.arc(0, 0, SNAIL_RADIUS*2.0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([6, 8]);
    ctx.lineDashOffset = -time*30;
    ctx.beginPath(); ctx.arc(0, 0, SNAIL_RADIUS*2.6, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (s.floating && hyp < 0.5){
    ctx.globalCompositeOperation = 'lighter';
    const pu = 0.5 + 0.5*Math.sin(time*2.2);

}

function drawSoulLight(){

  const pu = 0.7 + 0.3*Math.sin(time*4);

  g.addColorStop(0, 'rgba(255,250,220,1)');
  g.addColorStop(0.3, 'rgba(255,230,150,0.7)');
  g.addColorStop(0.7, 'rgba(255,200,90,0.2)');

  ctx.beginPath(); ctx.arc(x, y, R*4, 0, Math.PI*2); ctx.fill();
  const orbitA = time*2.6;
  for (let i=0; i<4; i++){
    const t = i/4;

    const sx = x + Math.cos(a)*rr, sy = y + Math.sin(a)*rr;

  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.stroke();

function drawTrailsWorld(){
  ctx.globalCompositeOperation = 'lighter';

  for (const p of trails){
    if (p.x < view.l-pad || p.x > view.r+pad || p.y < view.t-pad || p.y > view.b+pad) continue;
    const ii = Math.min(1.5, p.i);
    const t = Math.min(1, ii/1.5);
    let a = Math.min(1, ii)*ALPHA_K;
    let size = 40*(0.72 + t*0.55);
    if (p.isSpark){ size *= 0.35; a *= 1.6; }
    let drawDeep = true, drawCore = true;
    if (p.isPurple){

      ctx.globalAlpha = a*(1 - t*0.55);
      ctx.fillStyle = `rgba(190,120,255,0.9)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, ps*0.55, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a*t*1.2;
      ctx.fillStyle = `rgba(230,200,255,0.95)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, ps*0.28, 0, Math.PI*2); ctx.fill();
      drawDeep = false; drawCore = false;
    } else if (p.isBurning){
      ctx.globalAlpha = a*(1 - t*0.55);
      ctx.fillStyle = `rgba(255,140,40,0.95)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, size*0.65, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a*t*1.2;
      ctx.fillStyle = `rgba(255,240,120,1.0)`;

      ctx.fillStyle = `rgba(100,210,255,0.95)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, size*0.65, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a*t*1.2;
      ctx.fillStyle = `rgba(220,250,255,1.0)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, size*0.4, 0, Math.PI*2); ctx.fill();
      drawDeep = false; drawCore = false;
    }
    if (drawDeep){
      ctx.globalAlpha = a*(1 - t*0.55);

    }
    if (drawCore && t > 0.05){
      ctx.globalAlpha = a*t*1.20;

function drawOffscreenSnailArrows(){

    const isNightShrine = currentMapDef.night && s.shrine;
    if (onScreen && !isNightShrine) continue;
    offscreen.push({ s, sx, sy, d: Math.hypot(s.x - player.x, s.y - player.y) });
  }

  try { ctx.filter = 'blur(1.8px)'; } catch(_){}
  for (const o of show){

function drawArcBetween(x1, y1, x2, y2, colPrefix, strength, spread, minA){
  const ddx = x2-x1, ddy = y2-y1;
  const len = Math.hypot(ddx, ddy) || 1;
  const px = -ddy/len, py = ddx/len;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let arc=0; arc<2; arc++){
    const segs = 14;
    ctx.beginPath();
    for (let i=0; i<=segs; i++){
      const t = i/segs;
      const shape = Math.sin(t*Math.PI);
      const wave = Math.sin(t*12 + time*9 + arc*3.7)*spread*shape;
      const jitter = (Math.random()-0.5)*6*shape;
      const off = wave + jitter;
      const sx = x1 + ddx*t + px*off, sy = y1 + ddy*t + py*off;
      if (i===0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = `${colPrefix} ${Math.max(minA, 0.28*strength)})`;
    ctx.lineWidth = 7 - arc*1.6; ctx.stroke();
    ctx.strokeStyle = `${colPrefix} ${Math.max(minA*1.8, 0.68*strength)})`;
    ctx.lineWidth = 2.6 - arc*0.6; ctx.stroke();
    ctx.strokeStyle = `rgba(240,255,245,${Math.min(0.92, 0.6 + strength*0.4)})`;
    ctx.lineWidth = 1.0; ctx.stroke();
  }
  const flash = 8 + 6*Math.sin(time*11);
  for (const pos of [[x1,y1],[x2,y2]]){
    const fx = pos[0], fy = pos[1];
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, flash);
    fg.addColorStop(0, `rgba(230,255,240,${0.72*strength})`);
    fg.addColorStop(0.5, `${colPrefix} ${0.32*strength})`);
    fg.addColorStop(1, `${colPrefix} 0)`);
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fx, fy, flash, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function buildBlobPath(blob, cx, cy, scale){
  const N = blob.length;
  if (!N) return;
  const last = blob[N-1], first = blob[0];
  const sxLast = last.x*scale, syLast = last.y*scale;
  const sxFirst = first.x*scale, syFirst = first.y*scale;
  ctx.beginPath();
  ctx.moveTo(cx + (sxLast+sxFirst)*0.5, cy + (syLast+syFirst)*0.5);
  for (let i=0; i<N; i++){
    const cur = blob[i], next = blob[(i+1) % N];
    const cxp = cx + cur.x*scale, cyp = cy + cur.y*scale;
    const mx = cx + (cur.x+next.x)*0.5*scale, my = cy + (cur.y+next.y)*0.5*scale;
    ctx.quadraticCurveTo(cxp, cyp, mx, my);
  }
  ctx.closePath();
}

    ctx.lineWidth = 2 + a*2;
    ctx.shadowBlur = 12; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(player.x, player.y, R*(1.4 + (1-a)*0.6), 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if (player.skillLock > 0){
    const col = `rgba(255,60,80,${0.5 + 0.4*Math.sin(time*8)})`;
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 14; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(player.x, player.y, R*2.6, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if (player.stunTimer > 0){
    const col = `rgba(180,220,255,${0.6 + 0.3*Math.sin(time*12)})`;
    setSoftDash(col, [5, 6], -time*30, 2, 14);
    ctx.beginPath(); ctx.arc(player.x, player.y, R*2.2, 0, Math.PI*2); ctx.stroke();

}
function drawEnemyWorld(){
  const R = ENEMY_SIZE;
  const slow = enemy.slowFactor;
  const h = HUNTERS[enemy.hunterType] || HUNTERS.eclipse;
  const blob = enemy.blob;
  if (!blob) return;
  let alpha = 1;
  if (enemy.dying){
    alpha = Math.max(0, 1 - enemy.deathTimer/2.4);
    if (alpha <= 0) return;
  }
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  const layers = [{s:1.85,a:0.05},{s:1.60,a:0.08},{s:1.36,a:0.13},{s:1.15,a:0.20}];
  for (const L of layers){
    ctx.globalAlpha = alpha * L.a;
    ctx.fillStyle = `rgba(${h.rim},1)`;
    buildBlobPath(blob, enemy.x, enemy.y, L.s); ctx.fill();
  }
  const driftOn = enemy.driftTimer > 0;
  if (driftOn){
    const da = Math.min(1, enemy.driftTimer / DRIFT_DURATION);
    const spdNow = Math.hypot(enemy.vx, enemy.vy);
    if (spdNow > 30){
      const ux = enemy.vx / spdNow, uy = enemy.vy / spdNow;
      for (let i=1; i<=4; i++){
        ctx.globalAlpha = alpha * da * (0.26 - i*0.05);
        ctx.fillStyle = `rgba(160,255,230,1)`;
        buildBlobPath(blob, enemy.x - ux*i*20, enemy.y - uy*i*20, 1 - i*0.13); ctx.fill();
      }
    }
    ctx.globalAlpha = alpha;
    const col = `rgba(180,255,240,${da*0.85})`;
    setSoftDash(col, [8, 7], -time*55, 3, 18);
    buildBlobPath(blob, enemy.x, enemy.y, 1.72); ctx.stroke();
    clearSoftDash();
  }
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'source-over';
  buildBlobPath(blob, enemy.x, enemy.y, 1);
  const bg = ctx.createRadialGradient(enemy.x, enemy.y, 0, enemy.x, enemy.y, R*1.05);
  bg.addColorStop(0, h.bg1); bg.addColorStop(1, h.bg2);
  ctx.fillStyle = bg; ctx.fill();
  ctx.save();
  buildBlobPath(blob, enemy.x, enemy.y, 1);
  ctx.clip(); ctx.translate(enemy.x, enemy.y);
  ctx.globalCompositeOperation = 'lighter';
  const flows = h.flow;
  for (let i=0; i<flows.length; i++){
    const f = flows[i];
    const speed = 0.28 + i*0.17, phase = i * 1.37;
    const t = time*speed + phase;
    const ox = Math.cos(t)*R*0.55 + Math.sin(t*1.6 + i*0.7)*R*0.15;
    const oy = Math.sin(t*1.28)*R*0.55 + Math.cos(t*1.9 - i*0.5)*R*0.15;
    const rad = R*(0.85 + 0.24*Math.sin(time*1.15 + i*0.9) + 0.08*Math.cos(time*2.3 + i));
    const fg = ctx.createRadialGradient(ox, oy, 0, ox, oy, rad);
    fg.addColorStop(0.00, `rgba(${f.c1},${0.42 - i*0.04})`);
    fg.addColorStop(0.55, `rgba(${f.c2},${0.28 - i*0.035})`);
    fg.addColorStop(1.00, `rgba(${f.c2},0)`);
    ctx.fillStyle = fg; ctx.fillRect(-R, -R, R*2, R*2);
  }
  for (let i=0; i<20; i++){
    const seed = i * 41.317, t = time * 0.30;
    const baseA = seed % (Math.PI*2);
    const spiralT = (seed * 0.037) % 1;
    const a = baseA + t * (0.5 + spiralT * 0.8);
    const rr = R * (0.15 + spiralT * 0.85);
    const wob = Math.sin(time*1.6 + seed) * R * 0.08;
    const px = Math.cos(a) * rr + wob;
    const py = Math.sin(a) * rr + Math.cos(time*1.4 + seed*0.7) * R * 0.08;
    const size = R * (0.024 + (seed % 7) * 0.01);
    const cF = flows[i % flows.length];
    const alpha2 = 0.35 + 0.35 * Math.abs(Math.sin(time*1.9 + seed));
    ctx.fillStyle = `rgba(${cF.c1},${alpha2})`;
    ctx.beginPath(); ctx.arc(px, py, size * 2.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  for (let L=0; L<3; L++){
    const scale = 1 + L*0.06;
    buildBlobPath(blob, enemy.x, enemy.y, scale);
    const col = `rgba(${h.rim},${0.32 - L*0.08 - slow*0.08})`;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.4 - L*0.6;
    ctx.shadowBlur = 10; ctx.shadowColor = col;
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  buildBlobPath(blob, enemy.x, enemy.y, 1);
  const colB = `rgba(${h.rim},${0.65-slow*0.30})`;
  ctx.strokeStyle = colB; ctx.lineWidth = 1.2;
  ctx.shadowBlur = 12; ctx.shadowColor = colB;
  ctx.stroke(); ctx.shadowBlur = 0;
  if (enemy.hitFlash > 0.01){
    buildBlobPath(blob, enemy.x, enemy.y, 1);
    const fg = ctx.createRadialGradient(enemy.x, enemy.y, 0, enemy.x, enemy.y, R);
    fg.addColorStop(0, `rgba(255,255,255,${0.40*enemy.hitFlash})`);
    fg.addColorStop(1, 'rgba(200,240,255,0)');
    ctx.fillStyle = fg; ctx.fill();
  }
  if (enemy.hunterType === 'smoke' && !enemy.dying){
    for (let c=0; c<SMOKE_CHARGE_MAX; c++){
      const angle = -Math.PI/2 + c * Math.PI*2 / SMOKE_CHARGE_MAX;
      const cx = enemy.x + Math.cos(angle) * (R + 14);
      const cy = enemy.y + Math.sin(angle) * (R + 14);
      const filled = c < enemy.smokeCharges;
      ctx.fillStyle = filled ? `rgba(160,140,200,0.9)` : `rgba(40,35,60,0.6)`;
      ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(${h.rim},0.6)`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2); ctx.stroke();
    }
  }
  if (enemy.hunterType === 'arachne' && !enemy.dying){
    for (let c=0; c<MAX_SPIDERLINGS; c++){
      const angle = -Math.PI/2 + c * Math.PI*2 / MAX_SPIDERLINGS;
      const cx = enemy.x + Math.cos(angle) * (R + 18);
      const cy = enemy.y + Math.sin(angle) * (R + 18);
      const filled = c < spiderlings.length;
      ctx.fillStyle = filled ? `rgba(160,255,120,0.95)` : `rgba(30,50,20,0.6)`;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(${h.rim},0.7)`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.stroke();
    }
  }
  if (enemy.stunTimer > 0){
    const col = `rgba(255,200,100,${0.7 + 0.3*Math.sin(time*14)})`;
    setSoftDash(col, [5, 6], -time*40, 2.8, 18);
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, R*2.4, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
    for (let i = 0; i < 5; i++){
      const a = time * 3 + i * Math.PI * 2 / 5;
      const sr = R * 1.6;
      const sx = enemy.x + Math.cos(a) * sr;
      const sy = enemy.y + Math.sin(a) * sr - R * 0.6;
      ctx.fillStyle = `rgba(255,230,140,${0.7 + 0.3*Math.sin(time*6 + i)})`;
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  const manualOrPractice = (enemyMode === 'manual') || practiceMode;
  if (manualOrPractice && enemy.skillTimer <= 0 && !enemy.dying && enemy.hunterType !== 'smoke' && enemy.stunTimer <= 0){
    const pu = 0.5 + 0.5*Math.sin(time*6);
    const col = `rgba(${h.rim},${0.4 + pu*0.5})`;
    setSoftDash(col, [7, 6], -time*20, 2, 14);
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, R*2.6, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
  }
  if ((enemy.hunterType === 'pale' || enemy.hunterType === 'eclipse' || enemy.hunterType === 'arachne') && enemy.driftCd <= 0 && !enemy.dying){
    const pu = 0.5 + 0.5*Math.sin(time*4.5);
    const col = `rgba(180,255,240,${0.35 + pu*0.45})`;
    setSoftDash(col, [5, 8], time*22, 1.8, 12);
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, R*2.9, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
  }
  if (enemy.empowerCd <= 0 && !enemy.dying){
    const pu = 0.5 + 0.5*Math.sin(time*3.5);
    const col = `rgba(255,220,100,${0.3 + pu*0.5})`;
    setSoftDash(col, [4, 6], -time*18, 2, 14);
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, R*3.1, 0, Math.PI*2); ctx.stroke();
    clearSoftDash();
  }
  if (enemy.empowered && !enemy.dying){
    const pu = 0.5 + 0.5*Math.sin(time*8);
    const col = `rgba(255,200,80,${0.5 + pu*0.5})`;
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.shadowBlur = 22; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, R*3.3, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawSpiderlingsWorld(){
  for (const sp of spiderlings){
    if (sp.x < view.l-80 || sp.x > view.r+80 || sp.y < view.t-80 || sp.y > view.b+80) continue;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(Math.atan2(sp.vy, sp.vx));
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, SPIDERLING_R*3);
    g.addColorStop(0, 'rgba(180,255,120,0.55)');
    g.addColorStop(1, 'rgba(60,160,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, SPIDERLING_R*3, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(140,220,80,0.85)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    for (const leg of sp.legs){
      const wob = Math.sin(time * 12 + leg.angle) * 2;
      const ex = Math.cos(leg.angle) * leg.len + wob;
      const ey = Math.sin(leg.angle) * leg.len + wob;
      const mx = Math.cos(leg.angle) * leg.len * 0.6;
      const my = Math.sin(leg.angle) * leg.len * 0.6 - 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(mx, my - 3, ex, ey);
      ctx.stroke();
    }
    const bg = ctx.createRadialGradient(-2, -2, 0, 0, 0, SPIDERLING_R);
    bg.addColorStop(0, 'rgba(200,255,140,0.95)');
    bg.addColorStop(0.6, 'rgba(80,180,60,0.9)');
    bg.addColorStop(1, 'rgba(20,60,10,0.85)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, SPIDERLING_R, 0, Math.PI*2); ctx.fill();
    const hpR = Math.max(0, sp.hp / sp.maxHp);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, SPIDERLING_R*1.5, -Math.PI/2, -Math.PI/2 + hpR*Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,180,0.95)';
    ctx.beginPath(); ctx.arc(3, -3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-1, -4, 1.2, 0, Math.PI*2); ctx.fill();
    if (sp.pulledTimer > 0){
      ctx.globalCompositeOperation = 'lighter';
      const col = `rgba(180,255,200,${0.7 * (sp.pulledTimer/0.4)})`;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 12; ctx.shadowColor = col;
      ctx.beginPath(); ctx.arc(0, 0, SPIDERLING_R*1.9, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (sp.speedMul && sp.speedMul < 1){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(200,180,255,0.5)`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(0, 0, SPIDERLING_R*2.1, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawAttackArcsWorld(){
  if (attackIntensity < 0.01) return;
  const x1 = player.x, y1 = player.y, x2 = enemy.x, y2 = enemy.y;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx, dy) || 1;
  const px = -dy/len, py = dx/len;
  const I = attackIntensity;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let a=0; a<3; a++){
    const segments = 16;
    const startT = a*0.04, endT = 1 - a*0.04;
    ctx.beginPath();
    for (let i=0; i<=segments; i++){
      const t = startT + (endT-startT)*(i/segments);
      const shape = Math.sin(t*Math.PI);
      const noise = Math.sin(t*18 + time*32 + a*7.1)*20*shape;
      const jitter = (Math.random()-0.5)*10*shape;
      const off = noise + jitter;
      const sx = x1 + dx*t + px*off, sy = y1 + dy*t + py*off;
      if (i===0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = `rgba(120,190,255,${(0.30-a*0.06)*I})`;
    ctx.lineWidth = 8 - a*1.8; ctx.stroke();
    ctx.strokeStyle = `rgba(180,230,255,${(0.75-a*0.15)*I})`;
    ctx.lineWidth = 3.2 - a*0.7; ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${(0.95-a*0.20)*I})`;
    ctx.lineWidth = 1.2; ctx.stroke();
  }
  const flashSize = 14 + I*20 + Math.random()*8;
  const fg = ctx.createRadialGradient(x1, y1, 0, x1, y1, flashSize);
  fg.addColorStop(0, `rgba(230,245,255,${0.75*I})`);
  fg.addColorStop(0.5, `rgba(120,200,255,${0.30*I})`);
  fg.addColorStop(1, 'rgba(60,140,255,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(x1, y1, flashSize, 0, Math.PI*2); ctx.fill();
  const hitSize = 10 + I*16 + Math.random()*6;
  const hg = ctx.createRadialGradient(x2, y2, 0, x2, y2, hitSize);
  hg.addColorStop(0, `rgba(255,255,255,${0.65*I})`);
  hg.addColorStop(0.5, `rgba(255,180,120,${0.30*I})`);
  hg.addColorStop(1, 'rgba(255,80,30,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x2, y2, hitSize, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

function drawNightDarkness(){
  if (!currentMapDef || !currentMapDef.night) return;
  ensureDarkCanvas();
  darkCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  darkCtx.globalCompositeOperation = 'source-over';
  darkCtx.fillStyle = 'rgba(0, 0, 4, 0.985)';
  darkCtx.fillRect(0, 0, W, H);

  darkCtx.globalCompositeOperation = 'destination-out';
  const pr = (currentMapDef.lightPlayer || 210) * cam.zoom;
  const er = (currentMapDef.lightEnemy || 440) * cam.zoom;
  const px = (player.x - cam.cx) * cam.zoom + W/2;
  const py = (player.y - cam.cy) * cam.zoom + H/2;
  const ex = (enemy.x - cam.cx) * cam.zoom + W/2;
  const ey = (enemy.y - cam.cy) * cam.zoom + H/2;

  const gE = darkCtx.createRadialGradient(ex, ey, er*0.15, ex, ey, er);
  gE.addColorStop(0.00, 'rgba(0,0,0,1)');
  gE.addColorStop(0.55, 'rgba(0,0,0,0.92)');
  gE.addColorStop(0.85, 'rgba(0,0,0,0.35)');
  gE.addColorStop(1.00, 'rgba(0,0,0,0)');
  darkCtx.fillStyle = gE;
  darkCtx.beginPath(); darkCtx.arc(ex, ey, er, 0, Math.PI*2); darkCtx.fill();

  const gP = darkCtx.createRadialGradient(px, py, pr*0.15, px, py, pr);
  gP.addColorStop(0.00, 'rgba(0,0,0,1)');
  gP.addColorStop(0.55, 'rgba(0,0,0,0.92)');
  gP.addColorStop(0.85, 'rgba(0,0,0,0.30)');
  gP.addColorStop(1.00, 'rgba(0,0,0,0)');
  darkCtx.fillStyle = gP;
  darkCtx.beginPath(); darkCtx.arc(px, py, pr, 0, Math.PI*2); darkCtx.fill();

  if (soulLight.active){
    const sx = (soulLight.x - cam.cx) * cam.zoom + W/2;
    const sy = (soulLight.y - cam.cy) * cam.zoom + H/2;
    const sr = 180 * cam.zoom;
    const gS = darkCtx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    gS.addColorStop(0, 'rgba(0,0,0,1)');
    gS.addColorStop(0.6, 'rgba(0,0,0,0.6)');
    gS.addColorStop(1, 'rgba(0,0,0,0)');
    darkCtx.fillStyle = gS;
    darkCtx.beginPath(); darkCtx.arc(sx, sy, sr, 0, Math.PI*2); darkCtx.fill();
  }

  for (const s of snails){
    const p = s.connectProgress;
    if (p <= 0.01 && s.hypnotized < 0.3 && !s.shrine && !s.floating) continue;
    const sx = (s.x - cam.cx) * cam.zoom + W/2;
    const sy = (s.y - cam.cy) * cam.zoom + H/2;
    let sr = (60 + p*140) * cam.zoom;
    let strength = 0.25 + p*0.7;
    if (s.shrine){ sr = 260 * cam.zoom; strength = 0.95; }
    else if (s.floating){ sr = 140 * cam.zoom; strength = 0.6; }
    const gS = darkCtx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    gS.addColorStop(0, `rgba(0,0,0,${strength})`);
    gS.addColorStop(0.5, `rgba(0,0,0,${strength*0.5})`);
    gS.addColorStop(1, 'rgba(0,0,0,0)');
    darkCtx.fillStyle = gS;
    darkCtx.beginPath(); darkCtx.arc(sx, sy, sr, 0, Math.PI*2); darkCtx.fill();
  }

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(darkCanvas, 0, 0);
  ctx.restore();
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30, W/2, H/2, Math.max(W,H)*0.80);
  g.addColorStop(0, 'rgba(4,2,10,0)');
  g.addColorStop(1, 'rgba(4,2,10,0.90)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawJoystick(){
  ctx.globalCompositeOperation = 'source-over';
  if (joystick.active){
    const bx = joystick.baseX, by = joystick.baseY;
    const MAXR = 66;
    ctx.fillStyle = 'rgba(60,100,200,0.10)';
    ctx.beginPath(); ctx.arc(bx, by, MAXR, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(100,160,255,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, MAXR, 0, Math.PI*2); ctx.stroke();
    const ix = joystick.knobX - bx, iy = joystick.knobY - by;
    const d = Math.hypot(ix, iy);
    let kx = joystick.knobX, ky = joystick.knobY;
    if (d > MAXR){ kx = bx + ix/d*MAXR; ky = by + iy/d*MAXR; }
    const kg = ctx.createRadialGradient(kx, ky, 0, kx, ky, 30);
    kg.addColorStop(0, 'rgba(190,235,255,0.9)');
    kg.addColorStop(0.5, 'rgba(90,160,250,0.6)');
    kg.addColorStop(1, 'rgba(40,90,190,0)');
    ctx.fillStyle = kg;
    ctx.beginPath(); ctx.arc(kx, ky, 30, 0, Math.PI*2); ctx.fill();
  }
}
function drawFogOverlay(){

  const cx = W/2, cy = H/2;

    const a = Math.min(1, player.fogTimer / 1.5);

    blurTmpCtx.drawImage(blurSrc, 0, 0);
    blurTmpCtx.filter = 'none';
    blurTmpCtx.globalCompositeOperation = 'destination-in';
    const mg = blurTmpCtx.createRadialGradient(cx, cy, 30, cx, cy, Math.max(W, H) * 0.85);
    mg.addColorStop(0.00, 'rgba(0,0,0,0)');
    mg.addColorStop(0.10, 'rgba(0,0,0,0.05)');
    mg.addColorStop(0.25, 'rgba(0,0,0,0.35)');
    mg.addColorStop(0.50, 'rgba(0,0,0,0.85)');
    mg.addColorStop(0.75, 'rgba(0,0,0,0.98)');
    mg.addColorStop(1.00, 'rgba(0,0,0,1)');
    blurTmpCtx.fillStyle = mg;
    blurTmpCtx.fillRect(0, 0, blurTmp.width, blurTmp.height);
    blurTmpCtx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.drawImage(blurTmp, 0, 0, W, H);
    ctx.restore();
  }
  if (player.blindTimer > 0){
    const a = Math.min(1, player.blindTimer / 2.0);
    const bx = (player.blindX - cam.cx) * cam.zoom + cx;
    const by = (player.blindY - cam.cy) * cam.zoom + cy;
    blurTmpCtx.setTransform(1,0,0,1,0,0);
    blurTmpCtx.clearRect(0, 0, blurTmp.width, blurTmp.height);
    blurTmpCtx.filter = 'blur(120px)';
    blurTmpCtx.drawImage(blurSrc, 0, 0);
    blurTmpCtx.filter = 'none';
    blurTmpCtx.globalCompositeOperation = 'destination-in';
    const mg = blurTmpCtx.createRadialGradient(bx, by, 0, bx, by, 450);
    mg.addColorStop(0.00, 'rgba(0,0,0,1)');
    mg.addColorStop(0.35, 'rgba(0,0,0,0.98)');
    mg.addColorStop(0.65, 'rgba(0,0,0,0.65)');
    mg.addColorStop(1.00, 'rgba(0,0,0,0)');
    blurTmpCtx.fillStyle = mg;
    blurTmpCtx.fillRect(0, 0, blurTmp.width, blurTmp.height);
    blurTmpCtx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.drawImage(blurTmp, 0, 0, W, H);
    ctx.restore();
  }
}

const panel = document.getElementById('panel');

const dmgSlider = document.getElementById('dmgSlider');
const dmgVal = document.getElementById('dmgVal');
const rangeSlider = document.getElementById('rangeSlider');
const rangeVal = document.getElementById('rangeVal');
const trailSlider = document.getElementById('trailSlider');
const trailVal = document.getElementById('trailVal');
const btnAuto = document.getElementById('btnAuto');
const btnManual = document.getElementById('btnManual');
const btnTouchOn = document.getElementById('btnTouchOn');
const btnTouchOff = document.getElementById('btnTouchOff');
const skillBtn = document.getElementById('skillBtn');
const charBtn = document.getElementById('charBtn');
const shadowBtn = document.getElementById('shadowBtn');
const touchVBtn = document.getElementById('touchVBtn');
const touchEBtn = document.getElementById('touchEBtn');
const touchFBtn = document.getElementById('touchFBtn');

function setPanelVisible(v){
  const s = v && showTouchButtons;
  panel.style.display = v ? 'block' : 'none';
  panelToggle.style.display = v ? 'flex' : 'none';
  skillBtn.style.display = s ? 'flex' : 'none';
  charBtn.style.display = s ? 'flex' : 'none';
  shadowBtn.style.display = s ? 'flex' : 'none';
  if (!s){ touchVBtn.style.display = 'none'; touchEBtn.style.display = 'none'; touchFBtn.style.display = 'none'; touchKBtn.style.display = 'none'; }
}
function syncTouchToggleBtns(){
  if (showTouchButtons){ btnTouchOn.classList.add('on'); btnTouchOff.classList.remove('on'); }
  else { btnTouchOn.classList.remove('on'); btnTouchOff.classList.add('on'); }
}
panelToggle.addEventListener('pointerdown', e=>{ e.stopPropagation(); panel.classList.remove('collapsed'); panelToggle.classList.add('hidden'); });
panelClose.addEventListener('pointerdown', e=>{ e.stopPropagation(); panel.classList.add('collapsed'); panelToggle.classList.remove('hidden'); });
speedSlider.addEventListener('input', ()=>{ enemySpeedMul = parseFloat(speedSlider.value); speedVal.textContent = enemySpeedMul.toFixed(2)+'×'; });
dmgSlider.addEventListener('input', ()=>{ enemyDmgMul = parseFloat(dmgSlider.value); dmgVal.textContent = enemyDmgMul.toFixed(2)+'×'; });
rangeSlider.addEventListener('input', ()=>{ enemyRangeMul = parseFloat(rangeSlider.value); rangeVal.textContent = enemyRangeMul.toFixed(2)+'×'; });
trailSlider.addEventListener('input', ()=>{ trailResistMul = parseFloat(trailSlider.value); trailVal.textContent = trailResistMul.toFixed(2)+'×'; });
btnAuto.addEventListener('click', ()=>{ enemyMode='auto'; btnAuto.classList.add('on'); btnManual.classList.remove('on'); });
btnManual.addEventListener('click', ()=>{ enemyMode='manual'; btnManual.classList.add('on'); btnAuto.classList.remove('on'); });
btnTouchOn.addEventListener('click', ()=>{ showTouchButtons = true; savePrefs(); syncTouchToggleBtns(); });
btnTouchOff.addEventListener('click', ()=>{ showTouchButtons = false; savePrefs(); syncTouchToggleBtns(); });
skillBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if (gameState === 'playing' && !practiceMode) useSkill(); });
charBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if (gameState === 'playing' && !practiceMode) useCharSkill(); });
shadowBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if (gameState === 'playing') useShadowSkill(); });
touchVBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); e.preventDefault();
  if (gameState !== 'playing') return;
  if (enemy.hunterType === 'smoke'){
    if (enemy.smokeCharges > 0 && !enemy.dying) useSmokeSkill();
  } else if (enemy.hunterType === 'arachne' && enemy.skillTimer > 0 && spiderlings.length > 0){
    for (const sp of spiderlings){
      const dx = enemy.x - sp.x, dy = enemy.y - sp.y;
      const d = Math.hypot(dx, dy) || 1;
      sp.vx += (dx/d) * ARACHNE_V_PULL_IMPULSE;
      sp.vy += (dy/d) * ARACHNE_V_PULL_IMPULSE;
      sp.pulledTimer = 0.3;
    }
  } else {
    if (enemy.skillTimer <= 0 && !enemy.dying) tryHunterSkill();
  }
});
touchEBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if (gameState === 'playing') useEmpowerSkill(); });
touchFBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); e.preventDefault();
  if (gameState !== 'playing') return;
  if (enemy.hunterType === 'arachne') useArachnePull();
  else useDriftSkill();
});
touchKBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); e.preventDefault();
  if (gameState !== 'playing' || practiceMode) return;
  if (player.charType === 'wu') useKBlind();
  else if (player.charType === 'jing') useKMirror();
});
pauseBtnEl.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if (gameState === 'playing') gameState = 'paused'; else if (gameState === 'paused') gameState = 'playing'; });
syncTouchToggleBtns();
setPanelVisible(false);

let lastSkillText = '', lastCharText = '', lastCharActive = null, lastShadowState = null,
    lastFText = '', lastFCool = null, lastVCool = null, lastKText = '', lastKCool = null,
    lastEText = '', lastECool = null, lastEArmed = null, lastKShield = null;
function updateSkillBtn(){
  const playing = (gameState === 'playing');
  const show = playing && showTouchButtons;

  skillBtn.style.display = (show && !practiceMode) ? 'flex' : 'none';
  charBtn.style.display = (show && !practiceMode) ? 'flex' : 'none';
  shadowBtn.style.display = show ? 'flex' : 'none';
  const vShow = show && (practiceMode || enemyMode === 'manual');
  touchVBtn.style.display = vShow ? 'flex' : 'none';
  const eShow = show && (practiceMode || enemyMode === 'manual');
  touchEBtn.style.display = eShow ? 'flex' : 'none';
  const fShow = show && (enemy.hunterType === 'pale' || enemy.hunterType === 'eclipse' || enemy.hunterType === 'arachne');
  touchFBtn.style.display = fShow ? 'flex' : 'none';
  const kShow = show && !practiceMode && (player.charType === 'wu' || player.charType === 'jing');
  touchKBtn.style.display = kShow ? 'flex' : 'none';

  if (!playing || !showTouchButtons){
    if (lastSkillText !== ''){ lastSkillText = ''; skillBtn.textContent = 'P'; }
    if (lastCharText !== ''){ lastCharText = ''; charBtn.textContent = '['; }
    charBtn.classList.remove('active');
    lastCharActive = null;
    shadowBtn.textContent = 'B';
    shadowBtn.classList.remove('ready');
    lastShadowState = null;
    if (lastFText !== ''){ lastFText = ''; touchFBtn.textContent = 'F'; }
    if (lastKText !== ''){ lastKText = ''; touchKBtn.textContent = ']'; }
    if (lastEText !== ''){ lastEText = ''; touchEBtn.textContent = 'E'; }
    lastFCool = null; lastVCool = null; lastKCool = null; lastECool = null; lastEArmed = null;
    touchEBtn.classList.remove('armed');
    touchKBtn.classList.remove('shield');
    return;
  }

  const vCool = (enemy.hunterType === 'smoke') ? (enemy.smokeCharges <= 0) : (enemy.skillTimer > 0);
  if (vCool !== lastVCool){ lastVCool = vCool; touchVBtn.classList.toggle('cool', vCool); }
  const eCool = enemy.empowerCd > 0;
  if (eCool !== lastECool){ lastECool = eCool; touchEBtn.classList.toggle('cool', eCool); }
  const eArmed = !!enemy.empowered;
  if (eArmed !== lastEArmed){ lastEArmed = eArmed; touchEBtn.classList.toggle('armed', eArmed); }
  const etxt = enemy.empowerCd > 0 ? Math.ceil(enemy.empowerCd) + '' : (enemy.empowered ? '✦' : 'E');
  if (etxt !== lastEText){ lastEText = etxt; touchEBtn.textContent = etxt; }

  if (enemy.hunterType === 'pale' || enemy.hunterType === 'eclipse' || enemy.hunterType === 'arachne'){
    const fCool = enemy.driftCd > 0;
    if (fCool !== lastFCool){ lastFCool = fCool; touchFBtn.classList.toggle('cool', fCool); }
    const ftxt = enemy.driftCd > 0 ? Math.ceil(enemy.driftCd) + '' : 'F';
    if (ftxt !== lastFText){ lastFText = ftxt; touchFBtn.textContent = ftxt; }
  }

  if (player.charType === 'wu'){
    const kCool = player.blindCd > 0;
    if (kCool !== lastKCool){ lastKCool = kCool; touchKBtn.classList.toggle('cool', kCool); }
    const ktxt = player.blindCd > 0 ? Math.ceil(player.blindCd) + '' : ']';
    if (ktxt !== lastKText){ lastKText = ktxt; touchKBtn.textContent = ktxt; }
    touchKBtn.classList.remove('shield');
    lastKShield = false;
  } else if (player.charType === 'jing'){
    const kCool = player.mirrorKCd > 0;
    const shieldActive = player.damageReductionTimer > 0;
    if (kCool !== lastKCool || shieldActive !== lastKShield){
      lastKCool = kCool; lastKShield = shieldActive;
      touchKBtn.classList.toggle('cool', kCool && !shieldActive);
      touchKBtn.classList.toggle('shield', shieldActive);
    }
    const ktxt = kCool ? Math.ceil(player.mirrorKCd) + '' : (shieldActive ? '✦' : ']');
    if (ktxt !== lastKText){ lastKText = ktxt; touchKBtn.textContent = ktxt; }
  }

  const txt = player.skillCd > 0 ? Math.ceil(player.skillCd)+'' : 'P';
  if (txt !== lastSkillText){
    lastSkillText = txt; skillBtn.textContent = txt;
    skillBtn.classList.toggle('cool', player.skillCd > 0);
  }
  const ltxt = player.charSkillCd > 0
    ? Math.ceil(player.charSkillCd)+''
    : (player.charType === 'su' ? (player.markerPlaced ? '↺' : '[') : '[');
  if (ltxt !== lastCharText){
    lastCharText = ltxt; charBtn.textContent = ltxt;
    charBtn.classList.toggle('cool', player.charSkillCd > 0);
  }
  const active =
    (player.charType === 'yin' && player.phaseThrough > 0) ||
    (player.charType === 'zhi' && player.weaveActive > 0) ||
    (player.charType === 'su' && player.inertiaBuff > 0) ||
    (player.charType === 'xuan' && player.vortexActive > 0) ||
    (player.charType === 'wu' && player.fogTimer > 0) ||
    (player.charType === 'jing' && player.counterWindow > 0);
  if (active !== lastCharActive){ lastCharActive = active; charBtn.classList.toggle('active', active); }

  let bState;
  if (shadow.disabled) bState = 'idle';
  else if (shadow.active) bState = 'active';
  else if (enemy.huntProgress >= 1) bState = 'ready';
  else bState = 'idle';
  if (bState !== lastShadowState){
    lastShadowState = bState;
    shadowBtn.classList.toggle('ready', bState === 'ready');
    shadowBtn.classList.toggle('cool', bState === 'idle');
  }
  shadowBtn.textContent = shadow.active ? '↻' : (shadow.disabled ? '×' : 'B');
}

function drawCharPreview(rect, charId, small){
  const c = CHARACTERS[charId];
  const R = small ? 18 : 20;
  const cx = small ? (rect.x + rect.w/2) : (rect.x + 30);
  const cy = small ? (rect.y + 22) : (rect.y + 34);
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*3);
  gg.addColorStop(0, `rgba(${c.rim},0.45)`); gg.addColorStop(1, `rgba(${c.rim},0)`);
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, R*3, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const bg = ctx.createRadialGradient(cx-R*0.3, cy-R*0.4, R*0.1, cx, cy, R);
  bg.addColorStop(0, c.bg1); bg.addColorStop(1, c.bg2);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55;
  ctx.translate(cx, cy); ctx.rotate(time*0.4);
  ctx.drawImage(CORE_TEX, -R, -R, R*2, R*2);
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2,1,8,0.85)';
  ctx.beginPath(); ctx.ellipse(cx, cy, R*0.32, R*0.46, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${c.rim},0.85)`; ctx.lineWidth = 1.6; ctx.stroke();

  if (small){

    ctx.font = 'bold 11px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText(c.name, cx, rect.y + rect.h - 6);
    ctx.textAlign = 'left';

  }

  ctx.textAlign = 'left';
  const tx = rect.x + 58;

  ctx.fillStyle = 'rgba(200,220,255,0.75)';
  ctx.font = '9px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  const eff = c.skill.effect;
  if (eff.length > 14){ ctx.fillText(eff.slice(0,14), tx, rect.y + 46); ctx.fillText(eff.slice(14), tx, rect.y + 58); }
  else ctx.fillText(eff, tx, rect.y + 46);
  ctx.fillStyle = 'rgba(150,200,255,0.7)';
  ctx.fillText('移速 ' + c.stats.speed + ' · CD ' + c.stats.cd, tx, rect.y + 74);
  ctx.fillText('HP ' + c.stats.hp + ' · ' + c.stats.extra, tx, rect.y + 88);
}
function drawHunterPreview(rect, hunterId, small){
  const h = HUNTERS[hunterId];

  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, R*3, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  bg.addColorStop(0, h.bg1); bg.addColorStop(1, h.bg2);
  ctx.fillStyle = bg; ctx.fillRect(cx-R, cy-R, R*2, R*2);
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0; i<h.flow.length; i++){

  }
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  for (let L=0; L<2; L++){
    ctx.beginPath(); ctx.arc(cx, cy, R*(1 + L*0.10), 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${h.rim},${0.6 - L*0.25})`;

  ctx.font = 'bold 10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillStyle = `rgba(${h.rim},0.85)`;
  ctx.fillText('[' + h.skill.key + '] ' + h.skill.name, tx, rect.y + 28);
  ctx.fillStyle = 'rgba(200,220,255,0.65)';
  ctx.font = '9px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  const eff = h.skill.effect;

  else ctx.fillText(eff, tx, rect.y + 42);
  ctx.fillStyle = 'rgba(150,200,255,0.6)';
  ctx.fillText('范围 ' + h.atkRange + ' · 减速 ' + Math.round(h.maxSlow*100) + '%', tx, rect.y + 68);
  if (h.extraSkill){
    ctx.fillStyle = 'rgba(180,255,220,0.75)';
    ctx.fillText('[' + h.extraSkill.key + '] ' + h.extraSkill.name, tx, rect.y + 82);

}
function drawMapPreview(rect, mapId){
  const m = MAP_DEFS[mapId];
  const grad = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y+rect.h);
  grad.addColorStop(0, m.theme.bg0);
  grad.addColorStop(1, m.theme.bg2);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  const cx = rect.x + rect.w * 0.5, cy = rect.y + rect.h * 0.55;

function drawMenuButton(b, i, label, subtitle, icon, accentRGB, isActive){
  const t = time;
  const pulse = 0.85 + 0.15 * Math.sin(t * 2.2 + i * 0.7);
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(b.x + b.w/2, b.y + b.h/2, 0, b.x + b.w/2, b.y + b.h/2, b.w * 0.7);
  glow.addColorStop(0, `rgba(${accentRGB},${0.18 * pulse})`);
  glow.addColorStop(0.5, `rgba(${accentRGB},${0.06 * pulse})`);
  glow.addColorStop(1, `rgba(${accentRGB},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const bgGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (isActive){ bgGrad.addColorStop(0, `rgba(${accentRGB},0.22)`); bgGrad.addColorStop(1, `rgba(${accentRGB},0.06)`); }
  else { bgGrad.addColorStop(0, 'rgba(22,30,52,0.55)'); bgGrad.addColorStop(1, 'rgba(12,16,32,0.55)'); }
  ctx.fillStyle = bgGrad;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.strokeStyle = `rgba(${accentRGB},${isActive ? 0.85 : 0.45})`;
  ctx.lineWidth = isActive ? 2 : 1.4;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  const iconCX = b.x + 30, iconCY = b.y + b.h/2;
  ctx.globalCompositeOperation = 'lighter';
  const iconGlow = ctx.createRadialGradient(iconCX, iconCY, 0, iconCX, iconCY, 22);
  iconGlow.addColorStop(0, `rgba(${accentRGB},0.85)`);
  iconGlow.addColorStop(0.5, `rgba(${accentRGB},0.30)`);
  iconGlow.addColorStop(1, `rgba(${accentRGB},0)`);
  ctx.fillStyle = iconGlow;
  ctx.beginPath(); ctx.arc(iconCX, iconCY, 22, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(${accentRGB},1)`;
  ctx.font = 'bold 18px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText(icon, iconCX, iconCY + 6);
  ctx.textAlign = 'left';
  ctx.fillStyle = isActive ? 'rgba(255,255,255,0.98)' : 'rgba(215,230,255,0.92)';
  ctx.font = 'bold 15px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText(label, b.x + 56, b.y + b.h/2 + 1);
  ctx.fillStyle = `rgba(${accentRGB},${isActive ? 0.85 : 0.55})`;
  ctx.font = '10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText(subtitle, b.x + 56, b.y + b.h/2 + 14);
  ctx.fillStyle = `rgba(${accentRGB},0.9)`;
  ctx.font = 'bold 16px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.textAlign = 'right';
  ctx.fillText('›', b.x + b.w - 18, b.y + b.h/2 + 6);
  ctx.textAlign = 'left';
  const sweepT = (time * 0.5 + i * 0.3) % 3;
  if (sweepT < 0.6){
    const sweepX = b.x + (b.w + 60) * (sweepT / 0.6) - 30;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    const sweep = ctx.createLinearGradient(sweepX - 30, 0, sweepX + 30, 0);
    sweep.addColorStop(0, `rgba(${accentRGB},0)`);
    sweep.addColorStop(0.5, `rgba(${accentRGB},0.22)`);
    sweep.addColorStop(1, `rgba(${accentRGB},0)`);
    ctx.fillStyle = sweep;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  }
}
function drawMenu(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.85);
  bg.addColorStop(0.00, '#0d1128'); bg.addColorStop(0.35, '#080a1c');
  bg.addColorStop(0.72, '#05060f'); bg.addColorStop(1.00, '#020208');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0; i<60; i++){
    const seed = i * 91.7;
    const px = ((Math.sin(seed) * 0.5 + 0.5) * W + time * (4 + (i % 4) * 2)) % W;
    const py = ((Math.cos(seed * 1.3) * 0.5 + 0.5) * H + Math.sin(time * 0.4 + seed) * 20) % H;
    const r = 0.6 + (i % 4) * 0.7;
    const a = 0.10 + 0.30 * Math.abs(Math.sin(time * 0.6 + seed));
    ctx.fillStyle = `rgba(160,200,255,${a})`;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  }
  const topGlow = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, Math.max(W, H) * 0.6);
  topGlow.addColorStop(0, 'rgba(80,140,235,0.18)');
  topGlow.addColorStop(0.5, 'rgba(50,90,180,0.05)');
  topGlow.addColorStop(1, 'rgba(20,40,100,0)');
  ctx.fillStyle = topGlow;
  ctx.fillRect(0, 0, W, H * 0.6);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0; i<160; i++){
    const seed = i*137.5;
    const x = ((Math.sin(seed)*0.5 + 0.5)*W + time*5*(0.5 + (i%3)*0.3)) % W;
    const y = (Math.cos(seed*1.7)*0.5 + 0.5)*H*0.5;
    const r = 0.4 + (i%5)*0.35;
    const a = 0.10 + 0.40*Math.abs(Math.sin(time*0.7 + seed));
    ctx.fillStyle = `rgba(190,220,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  const cx = W/2, cy = Math.max(55, H*0.09);
  const breath = 1 + Math.sin(time*1.2)*0.06;
  const coreR = Math.min(36, Math.min(W, H) * 0.04) * breath;
  const outerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR*3.6);
  outerGlow.addColorStop(0.00, 'rgba(130,205,255,0.40)');
  outerGlow.addColorStop(0.28, 'rgba(80,140,235,0.15)');
  outerGlow.addColorStop(0.65, 'rgba(50,80,180,0.05)');
  outerGlow.addColorStop(1.00, 'rgba(30,50,140,0)');
  ctx.fillStyle = outerGlow; ctx.beginPath(); ctx.arc(cx, cy, coreR*3.6, 0, Math.PI*2); ctx.fill();
  const coreGrad = ctx.createRadialGradient(cx-coreR*0.22, cy-coreR*0.28, 5, cx, cy, coreR);
  coreGrad.addColorStop(0.00, 'rgba(230,250,255,0.98)');
  coreGrad.addColorStop(0.25, 'rgba(140,205,255,0.90)');
  coreGrad.addColorStop(0.60, 'rgba(50,105,200,0.85)');
  coreGrad.addColorStop(1.00, 'rgba(15,25,70,0.5)');
  ctx.fillStyle = coreGrad; ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(time*0.35); ctx.globalAlpha = 0.68;
  ctx.drawImage(CORE_TEX, -coreR, -coreR, coreR*2, coreR*2);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2,1,8,0.88)';
  ctx.beginPath(); ctx.ellipse(cx, cy, coreR*0.32, coreR*0.46, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(cx-coreR*0.30, cy-coreR*0.38, coreR*0.10, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(220,240,255,0.96)';
  ctx.font = 'bold 28px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.shadowBlur = 34; ctx.shadowColor = 'rgba(120,200,255,0.9)';
  ctx.fillText('瞳', cx, cy + coreR + 26);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(150,190,250,0.55)';
  ctx.font = '9px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText('P U P I L   ·   星 噬 之 瞳', cx, cy + coreR + 40);

  if (menuScreen === 'main'){
    const btnDefs = [
      { label: '开 始', sub: CHARACTERS[selectedChar].name + ' · ' + HUNTERS[selectedHunter].name + ' · ' + MAP_DEFS[selectedMapId].name, icon: '▶', rgb: '120,180,255' },
      { label: '练 习 追 猎', sub: '你控制追猎者 · AI 扮演瞳', icon: '⚔', rgb: '255,180,120' },
      { label: '局 内 调 整', sub: '选角 · 选图 · 选猎', icon: '⚙', rgb: '160,255,220' },
      { label: '局 内 按 钮 · ' + (showTouchButtons ? '开' : '关'), sub: showTouchButtons ? '触屏模式 · 显示全部按钮' : '键盘模式 · 隐藏全部按钮', icon: '▣', rgb: showTouchButtons ? '140,255,220' : '140,150,175' }
    ];
    for (let i=0; i<4; i++){
      const b = mainMenuBtnBounds(i);
      drawMenuButton(b, i, btnDefs[i].label, btnDefs[i].sub, btnDefs[i].icon, btnDefs[i].rgb, i === 3 ? showTouchButtons : false);
    }
    const sb = difficultySliderBounds();
    const t = (difficultyBias + 1) / 2;
    ctx.fillStyle = 'rgba(20,28,50,0.6)';
    ctx.beginPath(); ctx.roundRect(sb.x, sb.y, sb.w, sb.h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(100,160,255,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(sb.x, sb.y, sb.w, sb.h, 10); ctx.stroke();
    const fillW = sb.w * t;
    const fillGrad = ctx.createLinearGradient(sb.x, 0, sb.x + sb.w, 0);
    fillGrad.addColorStop(0, 'rgba(100,200,255,0.6)');
    fillGrad.addColorStop(0.5, 'rgba(200,200,200,0.4)');
    fillGrad.addColorStop(1, 'rgba(255,120,120,0.6)');
    ctx.fillStyle = fillGrad;
    ctx.beginPath(); ctx.roundRect(sb.x + 2, sb.y + 2, fillW - 4, sb.h - 4, 8); ctx.fill();
    const knobX = sb.x + fillW;
    ctx.fillStyle = 'rgba(220,240,255,0.95)';
    ctx.beginPath(); ctx.arc(knobX, sb.y + sb.h/2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(150,220,255,0.8)';
    ctx.beginPath(); ctx.arc(knobX, sb.y + sb.h/2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(180,210,255,0.7)';
    ctx.font = '10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText('游戏平衡', sb.x + sb.w/2, sb.y - 6);
    ctx.fillStyle = 'rgba(140,200,255,0.9)';
    ctx.fillText('易于角色', sb.x + 24, sb.y + sb.h/2 + 4);
    ctx.fillStyle = 'rgba(255,180,180,0.9)';
    ctx.fillText('易于追猎者', sb.x + sb.w - 36, sb.y + sb.h/2 + 4);
    ctx.fillStyle = 'rgba(150,200,255,0.55)';
    ctx.font = '10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText('方向键 → 瞳   ·   WASD → 追猎者   ·   P / [ / ] 技能', cx, H-18);
  } else if (menuScreen === 'adjust'){
    drawAdjustScreen();
  }
  ctx.textAlign = 'left';
  ctx.globalCompositeOperation = 'source-over';
}

function drawAdjustScreen(){
  // 返回按钮
  const bb = backBtnBounds();
  ctx.fillStyle = 'rgba(60,100,190,0.3)';
  ctx.beginPath(); ctx.roundRect(bb.x, bb.y, bb.w, bb.h, 8); ctx.fill();

  ctx.fillStyle = 'rgba(200,225,255,0.9)';
  ctx.font = '13px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('← 返回', bb.x + bb.w/2, bb.y + bb.h/2 + 5);

  // 标题
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(220,240,255,0.9)';

  ctx.fillText('◈  调 整  ◈', bb.x + bb.w + 12, bb.y + 24);
