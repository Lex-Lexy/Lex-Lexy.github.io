<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05060d; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:"ZCOOL KuaiLe","Ma Shan Zheng","Noto Serif SC","STKaiti","KaiTi",serif;
    letter-spacing:1px;
  }
  canvas { display:block; position:fixed; inset:0; }
  #panel {
    position:fixed; right:14px; bottom:14px; width:248px;
    padding:11px 13px; background:rgba(8,12,26,0.9);
    border:1px solid rgba(90,130,220,0.28); border-radius:12px;
    backdrop-filter:blur(12px); color:#9ab8e8; font-size:12px; z-index:10;
    box-shadow:0 4px 24px rgba(0,0,0,0.6);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1),opacity 0.24s;
    transform-origin:bottom right;
  }
  #panel.collapsed { transform:translateY(calc(100% + 40px)) scale(0.92); opacity:0; pointer-events:none; }
  #panelToggle {
    position:fixed; right:14px; bottom:14px; width:48px; height:48px; border-radius:50%;
    background:rgba(18,28,58,0.9); border:1px solid rgba(90,130,220,0.5);
    display:flex; align-items:center; justify-content:center;
    color:#a8c8f0; font-size:20px; cursor:pointer;
    z-index:11; user-select:none; box-shadow:0 4px 16px rgba(0,0,0,0.6);
  }
  #panelToggle.hidden { opacity:0; pointer-events:none; }
  .panelHeader { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(90,130,220,0.15); }
  .panelHeader span { color:rgba(180,215,255,0.8); font-size:11px; letter-spacing:4px; }
  #panelClose {
    width:22px; height:22px; border-radius:50%;
    background:rgba(60,100,190,0.25); border:1px solid rgba(100,160,255,0.3);
    color:#a8c8f0; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
  .row:last-child { margin-bottom:0; }
  .label { color:rgba(160,200,255,0.7); font-size:11px; min-width:28px; }
  input[type=range] {
    -webkit-appearance:none; appearance:none; flex:1; height:4px;
    margin:0 8px; background:rgba(80,120,200,0.25); border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;

  #touchVBtn { right:20px; bottom:180px; background:radial-gradient(circle at 35% 30%,rgba(220,240,180,0.4),rgba(50,100,50,0.6)); border:2px solid rgba(180,240,180,0.7); box-shadow:0 0 18px rgba(140,220,140,0.45); color:#f0fff0; font-size:14px; }
  #touchEBtn { right:20px; bottom:120px; background:radial-gradient(circle at 35% 30%,rgba(255,220,160,0.4),rgba(140,80,20,0.65)); border:2px solid rgba(255,220,150,0.8); box-shadow:0 0 18px rgba(255,190,90,0.5); color:#fff4e0; font-size:14px; }
  #touchFBtn { right:80px; bottom:180px; background:radial-gradient(circle at 35% 30%,rgba(220,255,250,0.4),rgba(20,90,80,0.65)); border:2px solid rgba(160,255,230,0.75); box-shadow:0 0 18px rgba(100,230,200,0.5); color:#eafffa; font-size:14px; }
  #touchKBtn { right:80px; bottom:240px; background:radial-gradient(circle at 35% 30%,rgba(255,220,200,0.4),rgba(120,60,80,0.65)); border:2px solid rgba(255,200,220,0.75); box-shadow:0 0 18px rgba(255,150,200,0.5); color:#ffeaf0; font-size:14px; }

  @keyframes sp2 { 0%,100% { box-shadow:0 0 20px rgba(255,190,90,0.6); } 50% { box-shadow:0 0 40px rgba(255,220,130,1); } }
  #pauseBtn {

if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
    this.beginPath();
    this.moveTo(x+r.tl, y); this.lineTo(x+w-r.tr, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r.tr);
    this.lineTo(x+w, y+h-r.br); this.quadraticCurveTo(x+w, y+h, x+w-r.br, y+h);
    this.lineTo(x+r.bl, y+h); this.quadraticCurveTo(x, y+h, x, y+h-r.bl);
    this.lineTo(x, y+r.tl); this.quadraticCurveTo(x, y, x+r.tl, y);
    this.closePath(); return this;
  };
}

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();

let showTouchButtons = false;
let difficultyBias = 0;
(function loadPrefs(){
  try {
    const v = localStorage.getItem('pupil_touchbtn');
    if (v !== null) showTouchButtons = v === '1';
    const d = localStorage.getItem('pupil_difficulty');
    if (d !== null) difficultyBias = parseFloat(d);

  try {

  } catch(_){}
}

/* ============================================================
 * 瞳 · 作弊数据加载
 * 由外部 cheat.html 写入 localStorage['pupil_cheat_data']
 * 启动时读取并覆盖 CHARACTERS / HUNTERS / 全局倍率
 * ============================================================ */
(function applyCheatData(){
  try {
    const raw = localStorage.getItem('pupil_cheat_data');
    if (!raw) return;
    const data = JSON.parse(raw);
    let count = 0;

    // ---- 角色 ----
    if (data.characters){
      for (const id in data.characters){
        const c = CHARACTERS[id], src = data.characters[id];
        if (!c || !src) continue;
        if (typeof src.speedMul === 'number'){ c.speedMul = src.speedMul; count++; }
        if (typeof src.skillCd === 'number' && c.skill){ c.skill.cd = src.skillCd; count++; }
      }
      // 「镜」的技能 CD 走全局常量 COUNTER_CD
      if (data.characters.jing && typeof data.characters.jing.skillCd === 'number'){
        try { COUNTER_CD = data.characters.jing.skillCd; count++; } catch(_){}
      }
    }

    // ---- 追猎者 ----
    if (data.hunters){
      for (const id in data.hunters){
        const h = HUNTERS[id], src = data.hunters[id];
        if (!h || !src) continue;
        if (typeof src.atkRange === 'number'){ h.atkRange = src.atkRange; count++; }
        if (typeof src.maxSlow === 'number'){ h.maxSlow = src.maxSlow; count++; }
        if (typeof src.baseDmgMul === 'number'){ h.baseDmgMul = src.baseDmgMul; count++; }
        if (typeof src.skillCd === 'number' && h.skill){ h.skill.cd = src.skillCd; count++; }
        if (typeof src.extraCd === 'number' && h.extraSkill){ h.extraSkill.cd = src.extraCd; count++; }
        if (typeof src.charge === 'number' && h.skill){ h.skill.charge = src.charge; count++; }
        if (typeof src.maxCharges === 'number' && h.skill){ h.skill.maxCharges = src.maxCharges; count++; }
      }
    }

    // ---- 全局倍率 ----
    if (data.global){
      const g = data.global;
      if (typeof g.enemySpeedMul === 'number'){ enemySpeedMul = g.enemySpeedMul; count++; }
      if (typeof g.enemyDmgMul === 'number'){ enemyDmgMul = g.enemyDmgMul; count++; }
      if (typeof g.enemyRangeMul === 'number'){ enemyRangeMul = g.enemyRangeMul; count++; }
      if (typeof g.trailResistMul === 'number'){ trailResistMul = g.trailResistMul; count++; }
      if (typeof g.difficultyBias === 'number'){ difficultyBias = g.difficultyBias; count++; }
    }

    console.log('%c[瞳·作弊] 已加载 ' + count + ' 项覆盖', 'color:#6aa8ff');
  } catch(e){
    console.warn('[瞳·作弊] 加载失败', e);
  }
})();

/* ========================= E. Blob Physics ============================== */
function setSoftDash(color, dashArr, dashOff, lineWidth, blur){
  ctx.setLineDash(dashArr);
  ctx.lineDashOffset = dashOff;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.shadowBlur = blur || (lineWidth * 6);
  ctx.shadowColor = color;
}
function clearSoftDash(){ ctx.setLineDash([]); ctx.shadowBlur = 0; }

function makeBlob(radius){
  const pts = [];
  for (let i=0; i<BLOB_VERTS; i++){
    const a = i/BLOB_VERTS * Math.PI*2;
    pts.push({ angle:a, x:Math.cos(a)*radius, y:Math.sin(a)*radius, vx:0, vy:0 });
  }
  return pts;
}
function resetBlob(ent, radius){ ent.blob = makeBlob(radius); ent.squeeze = 0; }
function resetBlobPositions(ent, radius){
  if (!ent.blob) return;
  for (const p of ent.blob){
    p.x = Math.cos(p.angle)*radius; p.y = Math.sin(p.angle)*radius;
    p.vx = 0; p.vy = 0;
  }
}
function updateBlobPhysics(ent, radius, canPassMembrane, dt){
  if (!ent.blob) return;
  const k = BLOB_SPRING, damp = BLOB_DAMP, push = BLOB_PUSH;
  const maxOff = radius * BLOB_MAX_OFF;
  const R2limit = radius + 60;
  const phasing = (ent === player) && player.phaseThrough > 0;
  for (let i=0; i<BLOB_VERTS; i++){
    const p = ent.blob[i];
    const wob = Math.sin(p.angle*3 + time*1.4)*BLOB_MEMBRANE_WOBBLE +
                Math.cos(p.angle*5 - time*1.9)*BLOB_MEMBRANE_WOBBLE*0.6;
    const restR = radius*(1+wob);
    const restX = Math.cos(p.angle)*restR;
    const restY = Math.sin(p.angle)*restR;
    const wx = ent.x + p.x, wy = ent.y + p.y;
    let ax = (restX - p.x)*k - p.vx*damp;
    let ay = (restY - p.y)*k - p.vy*damp;
    if (!phasing){
      for (let j=0; j<obstacles.length; j++){
        const ob = obstacles[j];
        if (canPassMembrane && ob.type === 'membrane') continue;
        const ddx = wx-ob.x, ddy = wy-ob.y;
        if (Math.abs(ddx) > R2limit || Math.abs(ddy) > R2limit) continue;
        const d = Math.hypot(ddx, ddy);
        if (d < ob.r && d > 0.001){
          const overlap = ob.r - d;
          const nx = ddx/d, ny = ddy/d;
          p.x += nx*overlap*push; p.y += ny*overlap*push;
          const vn = p.vx*nx + p.vy*ny;
          if (vn < 0){ p.vx -= vn*nx*0.6; p.vy -= vn*ny*0.6; }
        }
      }
    }
    p.vx += ax*dt; p.vy += ay*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    const lo = Math.hypot(p.x, p.y);
    if (lo > maxOff){ const s = maxOff/lo; p.x *= s; p.y *= s; }
  }
}
function computeSqueeze(ent, radius){
  if (!ent.blob) return 0;
  let total = 0;
  for (let i=0; i<BLOB_VERTS; i++){
    const p = ent.blob[i];
    const rx = Math.cos(p.angle)*radius, ry = Math.sin(p.angle)*radius;
    total += Math.hypot(p.x-rx, p.y-ry);
  }
  return Math.min(1, total / (BLOB_VERTS*radius*0.35));
}
function constrainCenter(ent, hardR, canPassMembrane){
  if (ent === player && player.phaseThrough > 0) return;
  for (let i=0; i<obstacles.length; i++){
    const ob = obstacles[i];
    if (canPassMembrane && ob.type === 'membrane') continue;
    const dx = ent.x-ob.x, dy = ent.y-ob.y;
    const d = Math.hypot(dx, dy);
    const minD = ob.r + hardR;
    if (d < minD && d > 0.001){
      const nx = dx/d, ny = dy/d;
      ent.x = ob.x + nx*minD; ent.y = ob.y + ny*minD;
      const vn = ent.vx*nx + ent.vy*ny;
      if (vn < 0){ ent.vx -= vn*nx*0.7; ent.vy -= vn*ny*0.7; }
    }
  }
}
function resolveSnailCollision(ent, hardR){
  for (let i=0; i<snails.length; i++){
    const s = snails[i];
    if (s.hypnotized > 0.5) continue;
    const dx = ent.x - s.x, dy = ent.y - s.y;
    const d = Math.hypot(dx, dy);
    const minD = SNAIL_COLLIDE_R + hardR;
    if (d < minD && d > 0.001){
      const nx = dx/d, ny = dy/d;
      const overlap = minD - d;
      ent.x += nx*overlap; ent.y += ny*overlap;
      const vn = ent.vx*nx + ent.vy*ny;
      if (vn < 0){ ent.vx -= vn*nx*0.45; ent.vy -= vn*ny*0.45; }
    }
  }
}

/* 调整界面布局 */
function adjustCharCardBounds(i){
  const n = 6;
  const cw = Math.min(54, (W - 40) / n - 4);
  const ch = 64;
  const gap = 4;
  const totalW = n*cw + (n-1)*gap;
  const sx = (W - totalW) / 2;
  const sy = 60;
  return { x: sx + i*(cw+gap), y: sy, w: cw, h: ch };
}
function adjustCharInfoBounds(){
  const w = Math.min(320, W - 40), h = 96;
  return { x: (W - w)/2, y: 60 + 64 + 8, w, h };
}
function adjustMapCardBounds(i){
  const size = Math.min(84, (W - 60) / 3 - 12);
  const gap = 16;
  const totalW = 3*size + 2*gap;
  const sx = (W - totalW)/2;
  const sy = H * 0.47;
  return { x: sx + i*(size+gap), y: sy, w: size, h: size };
}
function adjustHunterInfoBounds(){
  const w = Math.min(320, W - 40), h = 96;
  return { x: (W - w)/2, y: H*0.47 + 100, w, h };
}
function adjustHunterCardBounds(i){
  const n = 5;
  const cw = Math.min(56, (W - 40) / n - 4);
  const ch = 64;
  const gap = 4;
  const totalW = n*cw + (n-1)*gap;
  const sx = (W - totalW) / 2;
  const sy = H*0.47 + 100 + 96 + 8;
  return { x: sx + i*(cw+gap), y: sy, w: cw, h: ch };
}

function onDown(e){
  if (e.cancelable) e.preventDefault();
  if (gameState === 'menu'){
    if (menuScreen === 'main'){
      for (let i=0; i<4; i++){
        if (inRect(e.clientX, e.clientY, mainMenuBtnBounds(i))){
          if (i === 0){ practiceMode = false; startGame(); }
          else if (i === 1){ practiceMode = true; startGame(); }
          else if (i === 2){ menuScreen = 'adjust'; }
          else if (i === 3){ showTouchButtons = !showTouchButtons; savePrefs(); syncTouchToggleBtns(); }
          return;
        }
      }
      const sb = difficultySliderBounds();
      if (inRect(e.clientX, e.clientY, sb)){
        const t = clamp((e.clientX - sb.x) / sb.w, 0, 1);
        difficultyBias = t * 2 - 1;
        savePrefs();
        return;
      }
      if (inRect(e.clientX, e.clientY, startBtnBounds())){ practiceMode = false; startGame(); }
    } else if (menuScreen === 'adjust'){
      if (inRect(e.clientX, e.clientY, backBtnBounds())){ menuScreen = 'main'; return; }
      // 角色
      for (let i=0; i<6; i++){
        if (inRect(e.clientX, e.clientY, adjustCharCardBounds(i))){
          selectedChar = ['su','yin','zhi','xuan','wu','jing'][i];
          return;
        }
      }
      // 地图
      for (let i=0; i<3; i++){
        if (inRect(e.clientX, e.clientY, adjustMapCardBounds(i))){
          selectedMapId = ['void','night','buildings'][i];
          return;
        }
      }
      // 追猎者
      for (let i=0; i<5; i++){
        if (inRect(e.clientX, e.clientY, adjustHunterCardBounds(i))){
          selectedHunter = ['eclipse','crimson','pale','smoke','arachne'][i];
          return;
        }
      }
    }
    return;
  }
  if (gameState === 'intro') return;
  if (gameState === 'paused'){
    if (inRect(e.clientX, e.clientY, pauseResumeBtnBounds())) gameState = 'playing';
    else if (inRect(e.clientX, e.clientY, pauseQuitBtnBounds())){
      gameState = 'menu'; menuScreen='main'; setPanelVisible(false);
      document.getElementById('pauseBtn').classList.add('hidden');
    }
    return;
  }
  if (gameState === 'dead' || gameState === 'win'){
    const t = gameState === 'dead' ? deathTimer : winTimer;
    if (t > 0.8){ gameState='menu'; menuScreen='main'; setPanelVisible(false); document.getElementById('pauseBtn').classList.add('hidden'); }
    return;
  }
  if (inRect(e.clientX, e.clientY, pauseBtnBounds())){ gameState = 'paused'; return; }
  joystick.active = true; joystick.id = e.pointerId;
  joystick.baseX = e.clientX; joystick.baseY = e.clientY;
  joystick.knobX = e.clientX; joystick.knobY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
}
function onMove(e){
  if (gameState === 'intro') return;
  if (!joystick.active || e.pointerId !== joystick.id) return;
  joystick.knobX = e.clientX; joystick.knobY = e.clientY;
}
function onUp(e){
  if (!joystick.active) return;
  if (e && e.pointerId !== joystick.id) return;
  joystick.active = false; joystick.id = null;
}
canvas.addEventListener('pointerdown', onDown, { passive:false });
canvas.addEventListener('pointermove', onMove, { passive:false });
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
window.addEventListener('blur', ()=>onUp());

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'escape' && (gameState === 'playing' || gameState === 'paused')){
    gameState = (gameState === 'playing') ? 'paused' : 'playing';
    return;
  }
  if (gameState !== 'playing') return;
  if (k === 'p' && !practiceMode) useSkill();
  if (k === '[' && !practiceMode) useCharSkill();
  if (k === ']' && !practiceMode){
    if (player.charType === 'wu') useKBlind();
    else if (player.charType === 'jing') useKMirror();
  }
  if (k === 'e') useEmpowerSkill();
  if (k === 'f'){
    if (enemy.hunterType === 'arachne') useArachnePull();
    else useDriftSkill();
  }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

function readInput(){
  let sdx=0, sdy=0, smag=0;
  if (joystick.active){
    const ix = joystick.knobX - joystick.baseX;
    const iy = joystick.knobY - joystick.baseY;
    const d = Math.hypot(ix, iy);
    const DEAD = 6, MAXR = 62;
    if (d > DEAD){ smag = Math.min(1, (d-DEAD)/(MAXR-DEAD)); sdx = ix/d; sdy = iy/d; }
  }
  stickInput.dx = sdx; stickInput.dy = sdy; stickInput.mag = smag;
  // WASD → 追猎者
  let kx=0, ky=0;
  if (keys['w']) ky -= 1;
  if (keys['s']) ky += 1;
  if (keys['a']) kx -= 1;
  if (keys['d']) kx += 1;
  if (kx || ky){ const l = Math.hypot(kx, ky); keyInput.dx = kx/l; keyInput.dy = ky/l; keyInput.mag = 1; }
  else { keyInput.dx = 0; keyInput.dy = 0; keyInput.mag = 0; }
  // 方向键 → 玩家
  let ax=0, ay=0;
  if (keys['arrowup']) ay -= 1;
  if (keys['arrowdown']) ay += 1;
  if (keys['arrowleft']) ax -= 1;
  if (keys['arrowright']) ax += 1;
  if (ax || ay){ const l = Math.hypot(ax, ay); arrowInput.dx = ax/l; arrowInput.dy = ay/l; arrowInput.mag = 1; }
  else { arrowInput.dx = 0; arrowInput.dy = 0; arrowInput.mag = 0; }
}
function distributeInput(dt){
  playerInput.dx = 0; playerInput.dy = 0; playerInput.mag = 0;
  enemyInput.dx = 0; enemyInput.dy = 0; enemyInput.mag = 0;
  if (practiceMode){
    if (stickInput.mag > 0.01){ enemyInput.dx = stickInput.dx; enemyInput.dy = stickInput.dy; enemyInput.mag = stickInput.mag; }
    else if (keyInput.mag > 0.01){ enemyInput.dx = keyInput.dx; enemyInput.dy = keyInput.dy; enemyInput.mag = keyInput.mag; }
    else if (arrowInput.mag > 0.01){ enemyInput.dx = arrowInput.dx; enemyInput.dy = arrowInput.dy; enemyInput.mag = arrowInput.mag; }
    updatePlayerAI(dt);
  } else {
    // 玩家：摇杆优先，其次方向键
    if (stickInput.mag > 0.01){ playerInput.dx = stickInput.dx; playerInput.dy = stickInput.dy; playerInput.mag = stickInput.mag; }
    else if (arrowInput.mag > 0.01){ playerInput.dx = arrowInput.dx; playerInput.dy = arrowInput.dy; playerInput.mag = arrowInput.mag; }
    // 追猎者：自动或 WASD
    if (enemyMode === 'auto'){
      const dx = player.x - enemy.x, dy = player.y - enemy.y;
      const d = Math.hypot(dx, dy) || 1;
      enemyInput.dx = dx/d; enemyInput.dy = dy/d; enemyInput.mag = 1;
    } else {
      if (keyInput.mag > 0.01){ enemyInput.dx = keyInput.dx; enemyInput.dy = keyInput.dy; enemyInput.mag = keyInput.mag; }
    }
  }
}

/* ========================= G. Map Generation ============================ */
let buildingSnailSpots = [];

function initMapData(){
  obstacles.length = 0;
  buildingSnailSpots = [];
  currentMapDef = MAP_DEFS[selectedMapId] || MAP_DEFS.void;

  const count = (selectedMapId === 'buildings' || selectedMapId === 'night') ? 50 : 78;
  let tries = 0;
  const pS = { x:180, y:180 }, eS = { x:WORLD-180, y:WORLD-180 };
  while (obstacles.length < count && tries < 16000){
    tries++;
    const x = 180 + Math.random()*(WORLD-360);
    const y = 180 + Math.random()*(WORLD-360);
    const r = 22 + Math.random()*42;
    if (Math.hypot(x-pS.x, y-pS.y) < r+260) continue;
    if (Math.hypot(x-eS.x, y-eS.y) < r+260) continue;
    let ok = true;
    for (const o of obstacles) if (Math.hypot(x-o.x, y-o.y) < r + o.r + 20){ ok=false; break; }
    if (!ok) continue;
    let type = 'rock';
    if (Math.random() < 0.32) type = 'membrane';
    obstacles.push({ x, y, r, type, seed: Math.random()*1000 });
  }
  if (selectedMapId === 'buildings') generateBuildings();
  else if (selectedMapId === 'night') generateNightShrine();
}

function spotClear(x, y, r){
  if (x < 300 || x > WORLD-300 || y < 300 || y > WORLD-300) return false;
  for (const ob of obstacles){
    if (Math.hypot(x-ob.x, y-ob.y) < r + ob.r + 40) return false;
  }
  for (const b of buildingSnailSpots){
    if (Math.hypot(x-b.x, y-b.y) < r + 140) return false;
  }
  return true;
}
function findSpot(r){
  for (let i=0; i<300; i++){
    const x = 350 + Math.random()*(WORLD-700);
    const y = 350 + Math.random()*(WORLD-700);
    if (spotClear(x, y, r)) return { x, y };
  }
  return null;
}

/* 长板：一体化胶囊体（视觉上是一整条，不是小颗粒） */
function spawnPlank(){
  const segR = 32;
  const len = 5 + Math.floor(Math.random()*3);
  const spot = findSpot(segR * 2 + 100);
  if (!spot) return;
  const angle = Math.random() * Math.PI;
  const segGap = segR * 1.55;
  const halfLen = (len - 1) * segGap / 2;
  const dirX = Math.cos(angle), dirY = Math.sin(angle);
  for (let j = 0; j < len; j++){
    obstacles.push({
      x: spot.x + dirX*segGap*(j - (len-1)/2),
      y: spot.y + dirY*segGap*(j - (len-1)/2),
      r: segR,
      type: 'plank',
      // 一体化渲染参数
      plankCX: spot.x, plankCY: spot.y,
      plankAngle: angle,
      plankHalfLen: halfLen,
      plankWidth: segR,
      // 用同一组 key 保证整条长板只画一次
      plankKey: Math.floor(spot.x * 7 + spot.y * 13 + angle * 1000),
      seed: Math.random()*1000
    });
  }
}
function spawnShrine(opts){
  const R = 190;
  const spot = opts && opts.pos ? opts.pos : findSpot(R + 130);
  if (!spot) return;
  const pillarN = 14;
  for (let j = 0; j < pillarN; j++){
    if (j % 4 === 0) continue;
    const a = j/pillarN * Math.PI*2;
    obstacles.push({
      x: spot.x + Math.cos(a) * R,
      y: spot.y + Math.sin(a) * R,
      r: 28, type: 'shrine',
      shrineX: spot.x, shrineY: spot.y, shrineRadius: R,
      seed: Math.random()*1000
    });
  }
  // 神坛周边额外圆弧障碍（3 组）
  for (let arcIdx = 0; arcIdx < 3; arcIdx++){
    const arcR = R + 72 + arcIdx * 34;
    const arcCenterA = Math.random() * Math.PI * 2;
    const arcSpan = Math.PI * 0.62;
    const segN = 7;
    for (let j = 0; j < segN; j++){
      const t = segN === 1 ? 0.5 : j / (segN - 1);
      const a = arcCenterA + (t - 0.5) * arcSpan;
      obstacles.push({
        x: spot.x + Math.cos(a) * arcR,
        y: spot.y + Math.sin(a) * arcR,
        r: 22,
        type: 'shrine',
        shrineX: spot.x, shrineY: spot.y, shrineRadius: arcR,
        seed: Math.random()*1000
      });
    }
  }
  obstacles.push({
    x: spot.x, y: spot.y, r: 52,
    type: 'altar', seed: Math.random()*1000
  });
  buildingSnailSpots.push({
    x: spot.x, y: spot.y,
    shrine: true, immovable: true
  });
}
/* 危墙：内质网一体化（多层弧 + 径向勾连） */
function spawnWall(){
  const spot = findSpot(220);
  if (!spot) return;
  const baseAngle = Math.random() * Math.PI * 2;
  const layers = [148, 110, 74, 42];
  const arcSpan = Math.PI * 1.5;
  const stoneR = 18;
  const wallKey = Math.floor(spot.x * 7 + spot.y * 13);
  for (let li = 0; li < layers.length; li++){
    const R = layers[li];
    const segCount = li === 0 ? 10 : li === 1 ? 9 : li === 2 ? 8 : 7;
    for (let j = 0; j < segCount; j++){
      const t = segCount === 1 ? 0.5 : j / (segCount - 1);
      const a = baseAngle + (t - 0.5) * arcSpan;
      obstacles.push({
        x: spot.x + Math.cos(a) * R,
        y: spot.y + Math.sin(a) * R,
        r: stoneR,
        type: 'wall',
        wallCenterX: spot.x,
        wallCenterY: spot.y,
        wallBaseAngle: baseAngle,
        wallArcSpan: arcSpan,
        wallLayerR: R,
        wallKey: wallKey,
        seed: Math.random()*1000
      });
    }
  }
  // 层间勾连
  for (let li = 0; li < layers.length - 1; li++){
    const r1 = layers[li], r2 = layers[li+1];
    const midR = (r1 + r2) / 2;
    const connectors = 3 + (li % 2);
    for (let c = 0; c < connectors; c++){
      const t = (c + 0.5) / connectors;
      const a = baseAngle + (t - 0.5) * arcSpan * 0.85;
      obstacles.push({
        x: spot.x + Math.cos(a) * midR,
        y: spot.y + Math.sin(a) * midR,
        r: stoneR * 0.85,
        type: 'wall',
        wallCenterX: spot.x,
        wallCenterY: spot.y,
        wallBaseAngle: baseAngle,
        wallArcSpan: arcSpan,
        wallLayerR: midR,
        wallKey: wallKey,
        seed: Math.random()*1000
      });
    }
  }
  // 内部 1 只蜗
  const a0 = Math.random() * Math.PI * 2;
  const r0 = 10 + Math.random() * 12;
  buildingSnailSpots.push({
    x: spot.x + Math.cos(a0) * r0,
    y: spot.y + Math.sin(a0) * r0,
    shrine: false,
    wallHomeX: spot.x,
    wallHomeY: spot.y,
    wallRadius: 24
  });
}
function generateBuildings(){
  const arr = ['plank', 'shrine', 'wall'];
  for (let i = arr.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  arr.push(['plank','shrine','wall'][Math.floor(Math.random()*3)]);
  for (let i = arr.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  for (const kind of arr){
    if (kind === 'plank') spawnPlank();
    else if (kind === 'shrine') spawnShrine();
    else if (kind === 'wall') spawnWall();
  }
}
function generateNightShrine(){
  const pS = { x:180, y:180 }, eS = { x:WORLD-180, y:WORLD-180 };
  for (let i = 0; i < 200; i++){
    const x = 500 + Math.random()*(WORLD-1000);
    const y = 500 + Math.random()*(WORLD-1000);
    if (Math.hypot(x-pS.x, y-pS.y) < 600) continue;
    if (Math.hypot(x-eS.x, y-eS.y) < 600) continue;
    let ok = true;
    for (const ob of obstacles){
      if (Math.hypot(x-ob.x, y-ob.y) < ob.r + 300){ ok = false; break; }
    }
    if (!ok) continue;
    spawnShrine({ pos: { x, y } });
    return;
  }
}

function isOnPlank(x, y){
  for (const ob of obstacles){
    if (ob.type !== 'plank') continue;
    if (Math.hypot(x-ob.x, y-ob.y) < ob.r + 16) return true;
  }
  return false;
}

/* ============================== H. Skills =============================== */
function useDriftSkill(){
  if (enemy.hunterType !== 'pale' && enemy.hunterType !== 'eclipse') return;
  if (enemy.dying || gameState !== 'playing') return;
  if (enemy.driftCd > 0 || enemy.driftTimer > 0) return;
  const sp = Math.hypot(enemy.vx, enemy.vy);
  let ux, uy;
  if (sp > 12){ ux = enemy.vx / sp; uy = enemy.vy / sp; }
  else {
    const dx = player.x - enemy.x, dy = player.y - enemy.y;
    const d = Math.hypot(dx, dy) || 1;
    ux = dx / d; uy = dy / d;
  }
  enemy.driftTimer = DRIFT_DURATION;
  enemy.driftCd = enemy.hunterType === 'eclipse' ? HUNTERS.eclipse.extraSkill.cd : HUNTERS.pale.extraSkill.cd;
  enemy.vx += ux * DRIFT_IMPULSE;
  enemy.vy += uy * DRIFT_IMPULSE;
  enemy.slowFactor = 0;
  enemy.slowFromSnail = 0;
}
function useArachnePull(){

function useEmpowerSkill(){

function useSmokeSkill(){

function useSkill(){
  if (player.skillCd > 0 || player.skillLock > 0) return;
  player.skillCd = SKILL_CD;
  player.skillBoost = SKILL_BOOST;
  const sp = Math.hypot(player.vx, player.vy);
  let bx, by;
  if (sp > 15){ bx = -player.vx/sp; by = -player.vy/sp; }
  else { const a = Math.random()*Math.PI*2; bx = Math.cos(a); by = Math.sin(a); }
  const baseA = Math.atan2(by, bx);
  for (let i=0; i<68; i++){
    const spread = (Math.random()-0.5)*1.15;
    const a = baseA + spread;
    const dist_ = 6 + Math.random()*46;

    const py = player.y + Math.sin(a)*dist_;
    const spd = 55 + Math.random()*150;
    addTrail(px, py, 1.6+Math.random()*0.9, Math.cos(a)*spd, Math.sin(a)*spd, true, true);

function useKBlind(){

function useCharSkill(){
  if (player.charSkillCd > 0 || player.skillLock > 0) return;
  const type = player.charType;
  if (type === 'su'){
    if (!player.markerPlaced){
      player.markerX = player.x; player.markerY = player.y;
      player.markerPlaced = true; player.charSkillCd = 0.6;
    } else {
      const dx = player.markerX - player.x, dy = player.markerY - player.y;
      const d = Math.hypot(dx, dy);
      player.x = player.markerX; player.y = player.markerY;
      player.vx = 0; player.vy = 0;
      constrainCenter(player, PLAYER_HIT_R, true);
      resetBlobPositions(player, PLAYER_R);
      player.squeeze = 0;
      player.inertiaBuff = 3.0;
      player.markerPlaced = false;
      player.charSkillCd = CHARACTERS.su.skill.cd + Math.min(18, d / 160);
    }
  } else if (type === 'yin'){

    player.charSkillCd = CHARACTERS.yin.skill.cd;
  } else if (type === 'zhi'){
    player.weaveActive = 5.5;
    player.charSkillCd = CHARACTERS.zhi.skill.cd;
  } else if (type === 'xuan'){
    player.vortexActive = VORTEX_DURATION;
    player.vortexX = player.x; player.vortexY = player.y;
    player.charSkillCd = CHARACTERS.xuan.skill.cd;
  } else if (type === 'wu'){
    if (player.fogTimer > 0){ player.fogTimer = 0; return; }
    player.fogTimer = 3.0;
    player.charSkillCd = CHARACTERS.wu.skill.cd;
  } else if (type === 'jing'){
    const win = player.nextCounterEnhanced ? COUNTER_ENHANCED_WINDOW : COUNTER_BASE_WINDOW;
    player.counterWindow = win;
    player.nextCounterEnhanced = false;
    player.charSkillCd = COUNTER_CD;

}
function spawnShadowAt(x, y){
  shadow.active = true;
  shadow.x = x; shadow.y = y;
  shadow.vx = 0; shadow.vy = 0;
  shadow.r = SHADOW_RADIUS; shadow.visualR = 0;
  shadow.pullCd = 0; shadow.spawnFlash = 1;
}
function useShadowSkill(){
  if (enemy.dying) return;
  if (shadow.disabled) return;
  if (!shadow.active){
    if (enemy.huntProgress < 1) return;
    if (!shadowPending){ shadowPending = true; shadowPendingTime = time; return; }
    const dEtoP = Math.hypot(player.x - enemy.x, player.y - enemy.y);
    if (dEtoP < SHADOW_RADIUS) { shadowPending = false; return; }
    enemy.huntProgress = 0;
    spawnShadowAt(enemy.x, enemy.y);
    shadowPending = false;
  } else {
    if (shadow.pullCd > 0) return;
    shadow.pullCd = SHADOW_PULL_CD;
    const dx = enemy.x - shadow.x, dy = enemy.y - shadow.y;
    const d = Math.hypot(dx, dy) || 1;
    // 催眠速度减慢：捕获越多，加速越弱
    const spdMul = Math.max(0.3, 1 - shadow.captures * 0.15);
    shadow.vx += (dx/d) * SHADOW_ACCEL * 1.6 * spdMul;
    shadow.vy += (dy/d) * SHADOW_ACCEL * 1.6 * spdMul;
    shadow.spawnFlash = 0.7;
  }
}
function updateShadowPending(){
  if (!shadowPending) return;
  if (shadow.disabled){ shadowPending = false; return; }
  if (time - shadowPendingTime < SHADOW_PENDING_DELAY) return;
  if (enemy.huntProgress >= 1 && !shadow.active){
    enemy.huntProgress = 0;
    let bestX = enemy.x, bestY = enemy.y, bestScore = -1;
    for (const s of snails){
      let score = 0;
      for (const o of snails){ const d = Math.hypot(s.x-o.x, s.y-o.y); if (d < 500) score += 1 - d/500; }
      if (score > bestScore){ bestScore = score; bestX = s.x; bestY = s.y; }
    }
    spawnShadowAt(bestX, bestY);
  }
  shadowPending = false;
}
function triggerSpread(srcX, srcY, radius, type){
  const affected = [];
  for (const p of trails){
    const d = Math.hypot(p.x - srcX, p.y - srcY);
    if (d < radius) affected.push(p);
  }
  if (affected.length === 0) return;
  const visited = new Set();
  const queue = [...affected];
  const spreadStep = 140;
  const newTrails = [];
  while (queue.length > 0){
    const p = queue.shift();
    if (visited.has(p)) continue;
    visited.add(p);
    let blocked = false;
    for (const q of trails){
      if (q === p) continue;
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < spreadStep){
        if (q.isPlayerSkill) { blocked = true; break; }
        if (!visited.has(q) && !queue.includes(q)) queue.push(q);
      }
    }
    if (blocked) continue;
    const numSparks = type === 'burn' ? 16 : 12;
    for (let i = 0; i < numSparks; i++){
      const a = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 140;
      const dist_ = 4 + Math.random() * 22;
      newTrails.push({
        x: p.x + Math.cos(a) * dist_, y: p.y + Math.sin(a) * dist_,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        i: 0.5 + Math.random() * 0.6, born: time,
        isSpark: true, sparkType: type, life: 1.0 + Math.random() * 1.2
      });
    }
  }
  for (const nt of newTrails){
    trails.push({
      x: nt.x, y: nt.y, i: nt.i, born: nt.born, vx: nt.vx, vy: nt.vy,
      isBurning: type === 'burn', isFrost: type === 'frost',
      isSpark: true, sparkType: type, sparkTimer: nt.life
    });
  }
  if (type === 'burn') for (const p of visited){ p.isBurning = true; p.burnTimer = 6.0; }
  else if (type === 'frost') for (const p of visited){ p.isFrost = true; p.frostTimer = 6.0; }
}
function detonateSmoke(x, y){
  const radius = 220;
  for (const p of trails){
    if (p.isPlayerSkill) continue;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < radius){ p.isBurning = true; p.burnTimer = 6.0; }
  }
  for (let i = 0; i < 80; i++){
    const a = Math.random() * Math.PI * 2;
    const spd = 120 + Math.random() * 260;
    const dist_ = Math.random() * 30;
    trails.push({
      x: x + Math.cos(a) * dist_, y: y + Math.sin(a) * dist_,
      i: 0.7, born: time,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      isBurning: true, isSpark: true,
      sparkType: 'burn', sparkTimer: 1.8
    });
  }
  explosionFlashes.push({ x, y, time: 0, maxTime: 0.9, color:'255,160,60', radius: 280, ring: false });
}
/* 蛛召唤：普通 V → 延长线；E 强化 → 三方向，移速 50% */
function summonSpiderlings(count){
  const empowered = enemy.empowered;
  if (empowered && count > 1){
    // E 强化：3 个方向，每个 50% 移速
    const baseAngle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
    for (let i = 0; i < count; i++){
      if (spiderlings.length >= MAX_SPIDERLINGS) break;
      const a = baseAngle + (i - 1) * (Math.PI * 2 / 3);
      const d = ENEMY_SIZE + 80;
      const sx = clamp(enemy.x + Math.cos(a) * d, 60, WORLD - 60);
      const sy = clamp(enemy.y + Math.sin(a) * d, 60, WORLD - 60);
      spiderlings.push({
        x: sx, y: sy, vx: 0, vy: 0,

        legs: Array.from({length: 6}, (_, i) => ({ angle: i/6 * Math.PI*2 + Math.random()*0.3, len: 14 + Math.random()*4 }))
      });
    }
  } else {
    for (let i = 0; i < count; i++){
      if (spiderlings.length >= MAX_SPIDERLINGS) break;
      let sx = 2 * player.x - enemy.x + (Math.random() - 0.5) * 24;
      let sy = 2 * player.y - enemy.y + (Math.random() - 0.5) * 24;
      sx = clamp(sx, 60, WORLD - 60);
      sy = clamp(sy, 60, WORLD - 60);
      spiderlings.push({
        x: sx, y: sy, vx: 0, vy: 0,
        hp: SPIDERLING_HP, maxHp: SPIDERLING_HP, life: SPIDERLING_LIFE, hitCd: 0,
        pulledTimer: 0, speedMul: 1,
        phase: Math.random() * Math.PI * 2,
        legs: Array.from({length: 6}, (_, i) => ({ angle: i/6 * Math.PI*2 + Math.random()*0.3, len: 14 + Math.random()*4 }))
      });
    }
  }
}

/* ========================= I. Entity Updates ============================ */
function concentrationAtPlayer(){
  let sum = 0;
  for (const p of trails){
    const dx = p.x - player.x, dy = p.y - player.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < BOOST_R2){
      if (time - p.born < BOOST_FRESH) continue;
      const d = Math.sqrt(d2);
      const conc = Math.min(1, p.i/1.5);
      sum += conc * (1 - d/BOOST_R);
    }
  }
  return Math.min(1, sum/2.2);
}

function updateSoulLight(dt){
  if (!soulLight.active) return;
  soulLight.phase += dt * 2.2;
  if (soulLight.targetSnail){
    const s = soulLight.targetSnail;
    if (!s || s.connectProgress >= SOUL_LIGHT_MAX || s.hypnotized > 0.5){
      soulLight.targetSnail = null;
      if (s && s.connectProgress >= SOUL_LIGHT_MAX){
        soulLight.active = false;
        return;
      }
    }
  }
  if (soulLight.targetSnail){
    const s = soulLight.targetSnail;
    const dx = s.x - soulLight.x, dy = s.y - soulLight.y;
    const d = Math.hypot(dx, dy);
    const k = 1 - Math.exp(-9 * dt);
    soulLight.x += dx * k;
    soulLight.y += dy * k;
    if (d < 60){
      s.connectProgress = Math.min(SOUL_LIGHT_MAX, s.connectProgress + SOUL_LIGHT_RATE * dt);
    }
  } else {
    let best = null, bestD = 380;
    for (const s of snails){
      if (s.hypnotized > 0.5) continue;
      if (s.connectProgress <= 0.02 || s.connectProgress >= SOUL_LIGHT_MAX) continue;
      const d = Math.hypot(s.x - player.x, s.y - player.y);
      if (d < bestD){ bestD = d; best = s; }
    }
    if (best){ soulLight.targetSnail = best; }
    else {
      const orbitR = 52;
      const tx = player.x + Math.cos(soulLight.phase) * orbitR;
      const ty = player.y + Math.sin(soulLight.phase * 0.85) * orbitR;
      const k = 1 - Math.exp(-6 * dt);
      soulLight.x += (tx - soulLight.x) * k;
      soulLight.y += (ty - soulLight.y) * k;
    }
  }
}
function spawnSoulLight(x, y){
  soulLight.active = true;
  soulLight.x = x; soulLight.y = y;
  soulLight.targetSnail = null;
  soulLight.phase = 0;
}

function updatePlayer(dt){
  if (player.charSkillCd > 0) player.charSkillCd -= dt;
  if (player.inertiaBuff > 0 && (player.inertiaBuff -= dt) < 0) player.inertiaBuff = 0;
  if (player.phaseThrough > 0 && (player.phaseThrough -= dt) < 0) player.phaseThrough = 0;
  if (player.weaveActive > 0 && (player.weaveActive -= dt) < 0) player.weaveActive = 0;
  if (player.smokeSlow > 0 && (player.smokeSlow -= dt) < 0) player.smokeSlow = 0;
  if (player.skillLock > 0 && (player.skillLock -= dt) < 0) player.skillLock = 0;
  if (player.vortexActive > 0 && (player.vortexActive -= dt) < 0) player.vortexActive = 0;
  if (player.stunTimer > 0 && (player.stunTimer -= dt) < 0) player.stunTimer = 0;
  if (player.fogTimer > 0 && (player.fogTimer -= dt) < 0) player.fogTimer = 0;
  if (player.blindTimer > 0 && (player.blindTimer -= dt) < 0) player.blindTimer = 0;
  if (player.blindCd > 0) player.blindCd -= dt;
  if (player.mirrorKCd > 0) player.mirrorKCd -= dt;
  if (player.damageReductionTimer > 0){
    player.damageReductionTimer -= dt;
    if (player.damageReductionTimer <= 0){ player.damageReduction = 0; player.damageReductionTimer = 0; }
  }
  if (player.counterWindow > 0) player.counterWindow -= dt;

  const conc = concentrationAtPlayer();
  if (conc > 0.02) wakeTimer += dt;
  else { wakeTimer -= dt*2.5; if (wakeTimer < 0) wakeTimer = 0; }
  const timeFactor = 1 - Math.exp(-wakeTimer*2.2);
  player.boost += (conc*timeFactor - player.boost)*Math.min(1, dt*8);
  if (player.skillBoost > 0){ player.skillBoost -= dt*(SKILL_BOOST/SKILL_BOOST_T); if (player.skillBoost < 0) player.skillBoost = 0; }
  if (player.skillCd > 0) player.skillCd -= dt;

  const weaveOn = player.weaveActive > 0;
  const weaveBoost = weaveOn ? 1.3 : 1.0;
  const weaveHealMul = weaveOn ? 2.0 : 1.0;
  const weaveInertiaMul = weaveOn ? 1.7 : 1.0;
  let snailBoostRaw = 0, snailInertia = 0, snailHeal = 0;
  for (const s of snails){
    if (s.connectProgress <= 0.001 || s.boostActive <= 0.001) continue;
    const w = s.connectProgress * s.boostActive;
    snailBoostRaw += w; snailInertia += w; snailHeal += w;
  }
  snailBoostRaw = Math.min(1, snailBoostRaw) * 0.20 * weaveBoost;
  player.snailBoost += (snailBoostRaw - player.snailBoost)*Math.min(1, dt*5);
  playerSnailInertia = Math.min(SNAIL_INERTIA_MAX*1.8, snailInertia*SNAIL_INERTIA_MAX/2.5*weaveInertiaMul);
  playerSnailHeal = snailHeal*SNAIL_HEAL_MAX/2.5*weaveHealMul;
  if (playerSnailHeal > 0) player.hp = Math.min(player.maxHp, player.hp + playerSnailHeal*dt);
  if (frostSlow > 0 && (frostSlow -= dt) < 0) frostSlow = 0;
  if (playerBurnTimer > 0){ playerBurnTimer -= dt; player.hp -= 12 * dt; }
  if (playerFrostTimer > 0) playerFrostTimer -= dt;

  if (shadow.active && shadow.visualR > 1){
    const d = Math.hypot(player.x - shadow.x, player.y - shadow.y);
    if (d < shadow.visualR) playerShadowSlow = Math.min(0.85, playerShadowSlow + dt*3);
    else playerShadowSlow = Math.max(0, playerShadowSlow - dt*2);
  } else playerShadowSlow = Math.max(0, playerShadowSlow - dt*2);

  const char = CHARACTERS[player.charType] || CHARACTERS.su;
  const totalBoost = Math.min(1.9, player.boost + player.skillBoost + player.snailBoost);
  let maxSpd = BASE_MAX*(1 + totalBoost*BOOST_MAX) * char.speedMul;
  let accel = ACCEL*(1 + totalBoost*0.65) * char.speedMul;
  const driftOn = player.driftTimer > 0;
  const stunned = player.stunTimer > 0;
  if (!driftOn && !stunned){
    if (player.phaseThrough > 0){ maxSpd *= 1.40; accel *= 1.35; }
    if (frostSlow > 0){ maxSpd *= 0.45; accel *= 0.7; }
    if (playerFrostTimer > 0){ maxSpd *= 0.55; accel *= 0.8; }
    if (playerShadowSlow > 0){ maxSpd *= (1 - playerShadowSlow*0.7); accel *= (1 - playerShadowSlow*0.5); }
    if (player.smokeSlow > 0){
      const mul = Math.max(0.15, 1 - SMOKE_SLOW * player.smokeStacks);
      maxSpd *= mul;
      accel *= Math.max(0.2, 1 - SMOKE_SLOW * player.smokeStacks * 0.7);
    }
    const dAmt = player.squeeze;
    if (dAmt > 0.02){ maxSpd *= (1 - dAmt*0.94); accel *= (1 - dAmt*0.82); }
  } else if (driftOn){
    if (player.phaseThrough > 0){ maxSpd *= 1.40; accel *= 1.35; }
  }
  if (isOnPlank(player.x, player.y)){
    maxSpd *= 1.35;
    accel *= 1.3;
  }
  if (stunned){ maxSpd *= 0.15; accel *= 0.15; }

  const px = practiceMode ? aiInput.dx : playerInput.dx;
  const py = practiceMode ? aiInput.dy : playerInput.dy;
  const pmag = practiceMode ? aiInput.mag : playerInput.mag;
  if (pmag > 0 && !stunned){
    player.vx += px*pmag*accel*dt;
    player.vy += py*pmag*accel*dt;
  }
  const inertiaBoost = player.inertiaBuff > 0 ? 3.5*(player.inertiaBuff/3.0) : 0;
  const deformFriction = driftOn ? 0 : player.squeeze * 5.5;
  const driftFriction = driftOn ? -3.0 : 0;
  const frictionTotal = FRICTION + playerSnailInertia + deformFriction + inertiaBoost + driftFriction;
  const damp = Math.exp(-frictionTotal*dt);
  player.vx *= damp; player.vy *= damp;
  const spNow = Math.hypot(player.vx, player.vy);
  if (pmag === 0 && spNow < 160 && !driftOn && !stunned){
    const brake = Math.exp(-BRAKE*dt);
    player.vx *= brake; player.vy *= brake;
  }
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > maxSpd){ const k = maxSpd/sp; player.vx *= k; player.vy *= k; }
  if (sp < 2 && pmag === 0 && !driftOn){ player.vx = 0; player.vy = 0; }

  player.x += player.vx*dt; player.y += player.vy*dt;
  constrainCenter(player, PLAYER_HIT_R, true);
  resolveSnailCollision(player, PLAYER_HIT_R);
  updateBlobPhysics(player, PLAYER_R, true, dt);
  const newSq = computeSqueeze(player, PLAYER_R);
  player.squeeze += (newSq - player.squeeze) * Math.min(1, dt*12);

  const M = 80;
  if (player.x < M){ player.x = M; player.vx = Math.abs(player.vx)*0.35; }
  if (player.x > WORLD-M){ player.x = WORLD-M; player.vx = -Math.abs(player.vx)*0.35; }
  if (player.y < M){ player.y = M; player.vy = Math.abs(player.vy)*0.35; }
  if (player.y > WORLD-M){ player.y = WORLD-M; player.vy = -Math.abs(player.vy)*0.35; }
}

function tryHunterSkill(){
  if (enemy.skillTimer > 0 || enemy.dying) return;
  const h = HUNTERS[enemy.hunterType];
  if (!h) return;
  const dx = player.x - enemy.x, dy = player.y - enemy.y;
  const d = Math.hypot(dx, dy) || 1;
  if (enemy.hunterType === 'eclipse'){
    if (enemy.empowered && enemy.empowerTimer > 0){
      enemy.x = enemy.empowerTargetX; enemy.y = enemy.empowerTargetY;
      enemy.empowerTimer = 0;
      const radius = PLAYER_R * 5;
      for (const p of trails){
        const pd = Math.hypot(p.x - player.x, p.y - player.y);
        if (pd < radius){
          p.isPurple = true; p.purpleTimer = 6.0;
          p.vx = (p.x - player.x) * 2.5;
          p.vy = (p.y - player.y) * 2.5;
        }
      }
      for (let i = 0; i < 450; i++){
        const a = Math.random() * Math.PI * 2;
        const dist_ = Math.random() * radius;
        addTrail(player.x + Math.cos(a)*dist_, player.y + Math.sin(a)*dist_,
                 0.25 + Math.random()*0.25, Math.cos(a)*200, Math.sin(a)*200, true, false, true);
      }
      enemy.vx += (player.x - enemy.x) * 0.5;
      enemy.vy += (player.y - enemy.y) * 0.5;
      enemy.eclipseInvulnTimer = 2.0;
    } else {
      enemy.x += (dx/d)*180; enemy.y += (dy/d)*180;
    }
    enemy.empowered = false;
  }
  else if (enemy.hunterType === 'crimson'){
    enemy.dashActive = enemy.empowered ? 1.4 : 0.7;
    if (enemy.empowered) triggerSpread(enemy.x, enemy.y, 200, 'burn');
    enemy.empowered = false;
  }
  else if (enemy.hunterType === 'pale'){
    if (d < 340) frostSlow = 2.0;
    if (enemy.empowered) triggerSpread(enemy.x, enemy.y, 200, 'frost');
    enemy.empowered = false;
  }
  else if (enemy.hunterType === 'smoke') useSmokeSkill();
  else if (enemy.hunterType === 'arachne'){
    const count = enemy.empowered ? MAX_SPIDERLINGS : 1;
    summonSpiderlings(count);
    enemy.empowered = false;
  }
  if (h.skill.cd > 0) enemy.skillTimer = h.skill.cd;
}
function updateHunterSkill(dt){
  if (enemy.dying) return;
  if (enemy.stunTimer > 0) return;
  const h = HUNTERS[enemy.hunterType];
  if (!h) return;
  if (enemy.dashActive > 0) enemy.dashActive -= dt*1.4;
  if (enemy.empowerCd > 0) enemy.empowerCd -= dt;
  if (enemy.eclipseInvulnTimer > 0) enemy.eclipseInvulnTimer -= dt;

  // 蛛：V 冷却期间按 V 轻拉召唤物
  if (enemy.hunterType === 'arachne' && spiderlings.length > 0 && enemy.skillTimer > 0){
    const vEdge2 = keys['v'] && !prevVKey;
    if (vEdge2){
      for (const sp of spiderlings){
        const dx = enemy.x - sp.x, dy = enemy.y - sp.y;
        const d = Math.hypot(dx, dy) || 1;
        sp.vx += (dx/d) * ARACHNE_V_PULL_IMPULSE;
        sp.vy += (dy/d) * ARACHNE_V_PULL_IMPULSE;
        sp.pulledTimer = 0.3;
      }
    }
  }

  if (enemy.empowerTimer > 0){
    enemy.empowerTimer -= dt;
    if (enemy.empowerTimer <= 0 && enemy.empowered){
      enemy.x = enemy.empowerTargetX; enemy.y = enemy.empowerTargetY;
      enemy.empowered = false;
      const radius = PLAYER_R * 5;
      for (const p of trails){
        const pd = Math.hypot(p.x - player.x, p.y - player.y);
        if (pd < radius){
          p.isPurple = true; p.purpleTimer = 6.0;
          p.vx = (p.x - player.x) * 2.5;
          p.vy = (p.y - player.y) * 2.5;
        }
      }
      for (let i = 0; i < 450; i++){
        const a = Math.random() * Math.PI * 2;
        const dist_ = Math.random() * radius;
        addTrail(player.x + Math.cos(a)*dist_, player.y + Math.sin(a)*dist_,
                 0.25 + Math.random()*0.25, Math.cos(a)*200, Math.sin(a)*200, true, false, true);
      }
      enemy.eclipseInvulnTimer = 2.0;
    }
  }
  if (enemy.hunterType === 'smoke'){
    if (enemy.smokeCharges < SMOKE_CHARGE_MAX){
      enemy.smokeChargeTimer += dt;
      if (enemy.smokeChargeTimer >= SMOKE_CHARGE_TIME){
        enemy.smokeChargeTimer -= SMOKE_CHARGE_TIME;
        enemy.smokeCharges = Math.min(SMOKE_CHARGE_MAX, enemy.smokeCharges + 1);
      }
    }
  }
  let cdMult = 1;
  if (shadow.active && shadow.visualR > 1){
    const d = Math.hypot(enemy.x - shadow.x, enemy.y - shadow.y);
    if (d < shadow.visualR) cdMult = 3.5;
  }
  enemy.skillTimer -= dt * cdMult;
  if (enemy.hunterType === 'smoke'){
    const vEdge = keys['v'] && !prevVKey;
    if (vEdge && enemy.smokeCharges > 0 && !enemy.dying) useSmokeSkill();
  } else if (!practiceMode && enemyMode === 'manual'){
    if (keys['v'] && enemy.skillTimer <= 0) tryHunterSkill();
  } else if (practiceMode){
    if (keys['v'] && enemy.skillTimer <= 0) tryHunterSkill();
  } else if (enemyMode === 'auto'){
    if (enemy.skillTimer <= 0){
      const d = Math.hypot(player.x - enemy.x, player.y - enemy.y) || 1;
      let should = false;
      if (enemy.hunterType === 'eclipse') should = d > 240;
      else if (enemy.hunterType === 'crimson') should = d < 340;
      else if (enemy.hunterType === 'pale') should = d < 320;
      else if (enemy.hunterType === 'smoke') should = d < 420 && d > 100 && enemy.smokeCharges > 0;
      else if (enemy.hunterType === 'arachne') should = spiderlings.length < MAX_SPIDERLINGS;
      if (should) tryHunterSkill();
      else enemy.skillTimer = 0.4;
    }
  }
}
function respawnEnemy(){
  let nx=0, ny=0, ok=false, tries=0;
  while (!ok && tries++ < 80){
    const a = Math.random()*Math.PI*2;
    const d = 900 + Math.random()*600;
    nx = Math.max(160, Math.min(WORLD-160, player.x + Math.cos(a)*d));
    ny = Math.max(160, Math.min(WORLD-160, player.y + Math.sin(a)*d));
    ok = true;
    for (const ob of obstacles) if (Math.hypot(nx-ob.x, ny-ob.y) < ob.r + ENEMY_SIZE + 40){ ok=false; break; }
  }
  enemy.x = nx; enemy.y = ny; enemy.vx = 0; enemy.vy = 0;
  enemy.hp = ENEMY_HP; enemy.maxHp = ENEMY_HP;
  enemy.slowFactor = 0; enemy.slowFromSnail = 0;
  enemy.hitFlash = 0; enemy.dying = false; enemy.deathTimer = 0;
  enemy.skillTimer = HUNTERS[enemy.hunterType].skill.cd;
  enemy.dashActive = 0;
  enemy.driftTimer = 0; enemy.driftCd = 0;
  enemy.empowerCd = 0; enemy.empowered = false; enemy.empowerTimer = 0;
  enemy.eclipseInvulnTimer = 0;
  enemy.huntProgress = 0;
  enemy.smokeCharges = SMOKE_CHARGE_MAX; enemy.smokeChargeTimer = 0;
  enemy.stunTimer = 0;
  resetBlob(enemy, ENEMY_SIZE);
}
function updateEnemy(dt){
  if (enemy.hitFlash > 0) enemy.hitFlash -= dt*3;
  if (enemy.dying){ enemy.deathTimer += dt; if (enemy.deathTimer > 2.4) respawnEnemy(); return; }
  if (enemy.stunTimer > 0) enemy.stunTimer -= dt;
  if (enemy.driftTimer > 0) enemy.driftTimer -= dt;
  if (enemy.driftCd > 0) enemy.driftCd -= dt;
  const driftOn = enemy.driftTimer > 0;
  updateHunterSkill(dt);

  let trailSum = 0;
  for (const p of trails){
    const dx = p.x - enemy.x, dy = p.y - enemy.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < ENEMY_R2){
      if (time - p.born < 0.35) continue;
      const d = Math.sqrt(d2);
      trailSum += Math.min(1, p.i/1.2)*(1 - d/ENEMY_R);
    }
  }
  const enemySpdNow = Math.hypot(enemy.vx, enemy.vy);
  const speedRatio = Math.min(1.5, enemySpdNow / ENEMY_MAX);
  const speedFactor = 0.6 + speedRatio * 1.4;
  const conc = Math.min(1, trailSum/1.2) * speedFactor;
  const maxSlow = HUNTERS[enemy.hunterType].maxSlow;
  let targetSlow = driftOn ? 0 : Math.min(0.95, conc * maxSlow * trailResistMul * getBiasFactor());
  if (enemy.hunterType === 'eclipse' && enemy.eclipseInvulnTimer > 0) targetSlow = 0;
  enemy.slowFactor += (targetSlow - enemy.slowFactor)*Math.min(1, dt*3.5);
  if (enemy.huntProgress < 1 && enemy.slowFactor > 0.1)
    enemy.huntProgress = Math.min(1, enemy.huntProgress + enemy.slowFactor * 0.10 * dt);

  let snailSlow = 0;
  for (const s of snails){
    if (s.connectProgress < 0.28) continue;
    const d = Math.hypot(enemy.x - s.x, enemy.y - s.y);
    if (d > SNAIL_SLOW_RANGE) continue;
    const w = s.connectProgress * (1 - d/SNAIL_SLOW_RANGE);
    if (w > snailSlow) snailSlow = w;
  }
  enemy.slowFromSnail += (snailSlow*SNAIL_SLOW_MAX - enemy.slowFromSnail)*Math.min(1, dt*3);

  const totalSlow = driftOn ? 0 : Math.min(0.95, enemy.slowFactor + enemy.slowFromSnail);
  let accel = ENEMY_ACCEL*(1 - totalSlow*0.75) * getBiasFactor();
  let speedMul = 1;
  if (enemy.hunterType === 'crimson' && enemy.dashActive > 0){ speedMul = 2.6; accel *= 1.6; }
  if (driftOn) accel *= 1.35;
  if (isOnPlank(enemy.x, enemy.y)){
    speedMul *= 1.35;
    accel *= 1.3;
  }
  const dAmt = enemy.squeeze;
  const stunned = enemy.stunTimer > 0;
  if (enemyInput.mag > 0 && !stunned){
    enemy.vx += enemyInput.dx * enemyInput.mag * accel * dt;
    enemy.vy += enemyInput.dy * enemyInput.mag * accel * dt;
  }
  const trailFriction = enemy.slowFactor * 2.8;
  const deformFriction = driftOn ? 0 : dAmt * 3.2;
  const damp = Math.exp(-(ENEMY_FRIC + deformFriction + trailFriction)*dt);
  enemy.vx *= damp; enemy.vy *= damp;
  let maxSpd = ENEMY_MAX*enemySpeedMul*(1-totalSlow)*speedMul * getBiasFactor();
  if (dAmt > 0.02) maxSpd *= (1 - dAmt*0.78);
  if (stunned) maxSpd *= 0.15;
  const sp = Math.hypot(enemy.vx, enemy.vy);
  if (sp > maxSpd){ const k = maxSpd/sp; enemy.vx *= k; enemy.vy *= k; }
  if (stunned){ enemy.vx = 0; enemy.vy = 0; }
  enemy.x += enemy.vx*dt; enemy.y += enemy.vy*dt;

  constrainCenter(enemy, ENEMY_HIT_R, false);
  resolveSnailCollision(enemy, ENEMY_HIT_R);
  updateBlobPhysics(enemy, ENEMY_SIZE, false, dt);
  const newSq = computeSqueeze(enemy, ENEMY_SIZE);
  enemy.squeeze += (newSq - enemy.squeeze) * Math.min(1, dt*12);

  const M = 80;
  if (enemy.x < M){ enemy.x = M; enemy.vx = Math.abs(enemy.vx)*0.4; }
  if (enemy.x > WORLD-M){ enemy.x = WORLD-M; enemy.vx = -Math.abs(enemy.vx)*0.4; }
  if (enemy.y < M){ enemy.y = M; enemy.vy = Math.abs(enemy.vy)*0.4; }
  if (enemy.y > WORLD-M){ enemy.y = WORLD-M; enemy.vy = -Math.abs(enemy.vy)*0.4; }

  updateSpiderlings(dt);
}

function updateSpiderlings(dt){
  for (let i = spiderlings.length - 1; i >= 0; i--){
    const sp = spiderlings[i];
    sp.life -= dt;
    sp.hitCd -= dt;
    if (sp.pulledTimer > 0) sp.pulledTimer -= dt;
    if (sp.life <= 0){ spiderlings.splice(i, 1); continue; }
    const dx = player.x - sp.x, dy = player.y - sp.y;
    const d = Math.hypot(dx, dy) || 1;
    sp.vx += (dx/d) * SPIDERLING_ACCEL * dt;
    sp.vy += (dy/d) * SPIDERLING_ACCEL * dt;
    let trailHit = 0;
    for (const p of trails){
      if (p.isPlayerSkill) continue;
      const td = Math.hypot(p.x - sp.x, p.y - sp.y);
      if (td < 50) trailHit += Math.min(1, p.i/1.2) * (1 - td/50);
    }
    if (trailHit > 0){
      const slow = Math.min(0.85, trailHit * 0.7);
      sp.vx *= Math.exp(-slow * dt * 4);
      sp.vy *= Math.exp(-slow * dt * 4);
      sp.hp -= trailHit * 22 * SPIDERLING_TRAIL_MUL * dt;
    }
    if (sp.hp <= 0){
      explosionFlashes.push({ x: sp.x, y: sp.y, time: 0, maxTime: 0.4, color:'180,255,120', radius: 80, ring: false });
      spiderlings.splice(i, 1); continue;
    }
    const damp = Math.exp(-2.0 * dt);
    sp.vx *= damp; sp.vy *= damp;
    const spMul = sp.speedMul || 1;
    const speedCap = (sp.pulledTimer > 0) ? SPIDERLING_SPEED * 2.2 * spMul : SPIDERLING_SPEED * spMul;
    const spd = Math.hypot(sp.vx, sp.vy);
    if (spd > speedCap){ const k = speedCap / spd; sp.vx *= k; sp.vy *= k; }
    sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    const M = 60;
    if (sp.x < M){ sp.x = M; sp.vx = Math.abs(sp.vx)*0.5; }
    if (sp.x > WORLD-M){ sp.x = WORLD-M; sp.vx = -Math.abs(sp.vx)*0.5; }
    if (sp.y < M){ sp.y = M; sp.vy = Math.abs(sp.vy)*0.5; }
    if (sp.y > WORLD-M){ sp.y = WORLD-M; sp.vy = -Math.abs(sp.vy)*0.5; }
    const pd = Math.hypot(player.x - sp.x, player.y - sp.y);
    if (pd < PLAYER_R + SPIDERLING_R && sp.hitCd <= 0){
      sp.hitCd = SPIDERLING_HIT_CD;
      player.hp -= SPIDERLING_DMG;
      player.stunTimer = Math.max(player.stunTimer, 0.3);
      player.smokeSlow = Math.max(player.smokeSlow, 0.8);
      explosionFlashes.push({ x: sp.x, y: sp.y, time: 0, maxTime: 0.35, color:'200,255,140', radius: 90, ring: false });
      spiderlings.splice(i, 1);
    }
  }
}

function updateSmokeProjectiles(dt){
  for (let i = smokeProjectiles.length - 1; i >= 0; i--){
    const p = smokeProjectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < p.r + PLAYER_R * 0.6){
      player.smokeStacks = Math.min(SMOKE_MAX_STACK, player.smokeStacks + 1);
      player.smokeSlow = Math.max(player.smokeSlow, 1.4);
      if (player.smokeStacks >= 3) player.skillLock = SMOKE_SKILL_LOCK;
      if (p.empowered) detonateSmoke(p.x, p.y);
      smokeProjectiles.splice(i, 1); continue;
    }
    if (p.life <= 0){
      if (p.empowered) detonateSmoke(p.x, p.y);
      smokeProjectiles.splice(i, 1); continue;
    }
    if (p.empowered){
      let hitObs = false;
      for (const ob of obstacles){
        if (ob.type === 'membrane') continue;
        if (Math.hypot(p.x - ob.x, p.y - ob.y) < ob.r + p.r){ hitObs = true; break; }
      }
      if (hitObs){ detonateSmoke(p.x, p.y); smokeProjectiles.splice(i, 1); continue; }
    } else {
      // 普通弹：撞障碍 50% 触发爆炸，对周围目标造成 1s 电弧伤害
      let hitObs = false;
      for (const ob of obstacles){
        if (ob.type === 'membrane') continue;
        if (Math.hypot(p.x - ob.x, p.y - ob.y) < ob.r + p.r){ hitObs = true; break; }
      }
      if (hitObs){
        if (Math.random() < 0.5){
          const dp = Math.hypot(player.x - p.x, player.y - p.y);
          if (dp < 320){
            const arcDmg = DMG_K / (dp + 25);   // 相当于 1s 电弧伤害
            player.hp -= arcDmg;
            player.stunTimer = Math.max(player.stunTimer, 0.12);
          }
          explosionFlashes.push({ x: p.x, y: p.y, time: 0, maxTime: 0.55, color:'200,140,255', radius: 240, ring: true });
        }
        smokeProjectiles.splice(i, 1); continue;
      }
    }
  }
}

function updateShadow(dt){
  if (!shadow.active) return;
  if (shadow.pullCd > 0) shadow.pullCd -= dt;
  if (shadow.spawnFlash > 0) shadow.spawnFlash -= dt*1.8;
  shadow.vx *= Math.exp(-SHADOW_FRIC * dt);
  shadow.vy *= Math.exp(-SHADOW_FRIC * dt);
  // 催眠速度减慢：捕获越多，最大速度越低
  const spdMul = Math.max(0.3, 1 - shadow.captures * 0.15);
  const maxSpd = SHADOW_MAX_SPEED * spdMul;
  const sv = Math.hypot(shadow.vx, shadow.vy);
  if (sv > maxSpd){ const k = maxSpd/sv; shadow.vx *= k; shadow.vy *= k; }
  shadow.x += shadow.vx * dt; shadow.y += shadow.vy * dt;
  shadow.x = clamp(shadow.x, 0, WORLD);
  shadow.y = clamp(shadow.y, 0, WORLD);
  // 每次催眠后变小
  const sizeMul = Math.max(0.35, 1 - shadow.captures * 0.11);
  const targetR = SHADOW_RADIUS * sizeMul;
  shadow.r = targetR;
  shadow.visualR += (targetR - shadow.visualR) * Math.min(1, dt*2);
  // 吸引力变弱
  const attractMul = Math.max(0.3, 1 - shadow.captures * 0.15);
  for (const s of snails){
    const dx = shadow.x - s.x, dy = shadow.y - s.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) continue;
    const attraction = (200 / (1 + d * 0.015)) * attractMul;
    const pull = Math.max(30, attraction) * dt;
    s.x += (dx/d) * pull; s.y += (dy/d) * pull;
    if (d < shadow.visualR * 1.05){
      if (s.hypnotized < 0.5){
        // 祭坛蜗：连接完成后不能被催眠
        if (s.shrine && s.connectProgress >= 0.999) continue;
        s.hypnotized = 1.0;
        s.connectProgress = 0;
        s.vx = 0; s.vy = 0;
        s.attached = false; s.attachOb = null;
        shadow.captures++;
        if (shadow.captures >= SHADOW_MAX_CAPTURES){
          shadow.active = false;
          shadow.disabled = true;
          explosionFlashes.push({ x: shadow.x, y: shadow.y, time: 0, maxTime: 1.2, color:'255,40,120', radius: 300, ring: true });
        }
      }
    }
  }
}

function updateSnails(dt){
  const weaveOn = player.weaveActive > 0;
  const connectRange = SNAIL_CONNECT_RANGE * (weaveOn ? 2.5 : 1);
  const vortexOn = player.vortexActive > 0;

  for (const s of snails){
    s.inVortex = false;

    if (s.floating){
      s.phase += dt * 0.3;
      s.wanderTimer -= dt;
      if (s.wanderTimer <= 0){
        s.wanderTimer = 4 + Math.random()*5;
        s.wanderAngle += (Math.random()-0.5)*Math.PI*1.2;
      }
      const spd = SNAIL_SPEED * 0.65;
      s.vx += (Math.cos(s.wanderAngle)*spd - s.vx)*Math.min(1, dt*0.4);
      s.vy += (Math.sin(s.wanderAngle)*spd - s.vy)*Math.min(1, dt*0.4);
      s.x += s.vx*dt; s.y += s.vy*dt;
      const M = 200;
      if (s.x < M){ s.x = M; s.wanderAngle = Math.PI - s.wanderAngle; }
      if (s.x > WORLD-M){ s.x = WORLD-M; s.wanderAngle = Math.PI - s.wanderAngle; }
      if (s.y < M){ s.y = M; s.wanderAngle = -s.wanderAngle; }
      if (s.y > WORLD-M){ s.y = WORLD-M; s.wanderAngle = -s.wanderAngle; }
      const d = Math.hypot(player.x - s.x, player.y - s.y);
      if (d < connectRange){
        const rate = (1 - d/connectRange)*SNAIL_CONNECT_RATE*(weaveOn ? 1.3 : 1);
        s.connectProgress = Math.min(1, s.connectProgress + rate*dt);
      }
      const target = Math.max(0, 1 - d/connectRange);
      s.boostActive += (target - s.boostActive)*Math.min(1, dt*4);
      if (s.boostActive < 0.001) s.boostActive = 0;
      continue;
    }

    if (s.immovable){
      const d = Math.hypot(player.x - s.x, player.y - s.y);
      if (d < connectRange){
        const rate = (1 - d/connectRange) * SNAIL_CONNECT_RATE * (weaveOn ? 1.3 : 1) * SHRINE_CONNECT_MUL;
        s.connectProgress = Math.min(1, s.connectProgress + rate * dt);
      } else if (s.connectProgress > 0 && s.connectProgress < 0.999){
        s.connectProgress = Math.max(0, s.connectProgress - SNAIL_DECAY_RATE * dt);
      }
      const target = Math.max(0, 1 - d/connectRange);
      s.boostActive += (target - s.boostActive)*Math.min(1, dt*4);
      if (s.boostActive < 0.001) s.boostActive = 0;
      if (s.shrine && !soulLight.active && s.connectProgress >= 0.999){
        spawnSoulLight(s.x, s.y);
        explosionFlashes.push({ x: s.x, y: s.y, time: 0, maxTime: 1.0, color:'255,240,180', radius: 200, ring: true });
      }
      continue;
    }

    if (vortexOn && s.hypnotized <= 0.5){
      const vdx = player.vortexX - s.x, vdy = player.vortexY - s.y;
      const vd = Math.hypot(vdx, vdy);
      if (vd < VORTEX_RADIUS && vd > 0.001){
        s.inVortex = true;
        const pull = VORTEX_PULL * dt;
        s.x += (vdx/vd) * pull; s.y += (vdy/vd) * pull;
        s.attached = false; s.attachOb = null;
      }
    }

    if (s.hypnotized > 0.5){
      s.phase += dt * 0.4; s.bob += dt * 0.6;
      const d = Math.hypot(player.x - s.x, player.y - s.y);
      if (d < connectRange){
        const rate = (1 - d/connectRange)*SNAIL_CONNECT_RATE*(weaveOn ? 1.3 : 1)*SNAIL_HYPNOTIZE_MUL;
        s.connectProgress = Math.min(1, s.connectProgress + rate*dt);
      }
      const target = Math.max(0, 1 - d/connectRange);
      s.boostActive += (target - s.boostActive)*Math.min(1, dt*4);
      if (s.boostActive < 0.001) s.boostActive = 0;
      continue;
    }

    const inWall = (s.wallHomeX !== undefined);
    if (inWall){
      const dToHome = Math.hypot(s.x - s.wallHomeX, s.y - s.wallHomeY);
      if (dToHome > s.wallRadius){
        const dx = s.wallHomeX - s.x, dy = s.wallHomeY - s.y;
        s.vx += (dx/(dToHome||1)) * 100 * dt;
        s.vy += (dy/(dToHome||1)) * 100 * dt;
      }
    }

    if (!s.attached && !s.inVortex){
      s.wanderTimer -= dt;
      if (s.wanderTimer <= 0){ s.wanderTimer = 3 + Math.random()*5; s.wanderAngle += (Math.random()-0.5)*Math.PI*1.2; }
      const spdMul = inWall ? SNAIL_WALL_SLOW : 1.0;
      const tvx = Math.cos(s.wanderAngle)*SNAIL_SPEED*spdMul;
      const tvy = Math.sin(s.wanderAngle)*SNAIL_SPEED*spdMul;
      s.vx += (tvx - s.vx)*Math.min(1, dt*0.5);
      s.vy += (tvy - s.vy)*Math.min(1, dt*0.5);
      s.x += s.vx*dt; s.y += s.vy*dt;
      let nearRock = null, nearD = 1e9;
      for (const ob of obstacles){
        if (ob.type === 'membrane') continue;
        if (inWall && ob.type === 'wall') continue;
        const d = Math.hypot(s.x - ob.x, s.y - ob.y) - ob.r;
        if (d < SNAIL_ATTACH_RANGE && d < nearD){ nearD = d; nearRock = ob; }
      }
      if (nearRock && Math.random() < dt * SNAIL_ATTACH_RATE * (1 - nearD/SNAIL_ATTACH_RANGE)){
        s.attached = true; s.attachOb = nearRock;
        s.attachAngle = Math.atan2(s.y - nearRock.y, s.x - nearRock.x);
        s.attachTimer = 12 + Math.random()*18;
        s.attachDir = Math.random() < 0.5 ? 1 : -1;
      }
    } else if (s.attached && !s.inVortex){
      const ob = s.attachOb;
      if (!ob){ s.attached = false; continue; }
      s.attachTimer -= dt;
      const attachSpeed = (ob.type === 'wall') ? 0.12 : 0.45;
      s.attachAngle += s.attachDir * attachSpeed * dt;
      const targetR = ob.r + SNAIL_RADIUS*0.30;
      const tx = ob.x + Math.cos(s.attachAngle)*targetR;
      const ty = ob.y + Math.sin(s.attachAngle)*targetR;
      const followK = 1 - Math.exp(-6*dt);
      s.x += (tx - s.x)*followK; s.y += (ty - s.y)*followK;
      s.vx *= 0.5; s.vy *= 0.5;
      if (s.attachTimer <= 0 || Math.random() < dt*SNAIL_DETACH_RATE){
        s.attached = false; s.attachOb = null;
        s.wanderAngle = s.attachAngle + s.attachDir*Math.PI/2 + (Math.random()-0.5)*0.6;
        s.wanderTimer = 2 + Math.random()*4;
      }
    }
    for (const ob of obstacles){
      if (ob.type === 'membrane') continue;
      const d = Math.hypot(s.x - ob.x, s.y - ob.y);
      const minD = ob.r + SNAIL_RADIUS*0.5;
      if (d < minD && d > 0.001){
        const nx = (s.x-ob.x)/d, ny = (s.y-ob.y)/d;
        s.x = ob.x + nx*minD; s.y = ob.y + ny*minD;
      }
    }
    const M = 120;
    if (s.x < M){ s.x = M; s.wanderAngle = Math.PI - s.wanderAngle; }
    if (s.x > WORLD-M){ s.x = WORLD-M; s.wanderAngle = Math.PI - s.wanderAngle; }
    if (s.y < M){ s.y = M; s.wanderAngle = -s.wanderAngle; }
    if (s.y > WORLD-M){ s.y = WORLD-M; s.wanderAngle = -s.wanderAngle; }

    const d = Math.hypot(player.x - s.x, player.y - s.y);
    if (d < connectRange){
      const vortexMul = s.inVortex ? 2.0 : 1.0;
      const rate = (1 - d/connectRange)*SNAIL_CONNECT_RATE*(weaveOn ? 1.3 : 1)*vortexMul;
      s.connectProgress = Math.min(1, s.connectProgress + rate*dt);
    } else if (s.connectProgress > 0 && s.connectProgress < 0.999){
      s.connectProgress = Math.max(0, s.connectProgress - SNAIL_DECAY_RATE * dt);
    }
    const target = Math.max(0, 1 - d/connectRange);
    s.boostActive += (target - s.boostActive)*Math.min(1, dt*4);
    if (s.boostActive < 0.001) s.boostActive = 0;

    if (s.shrine && !soulLight.active && s.connectProgress >= 0.999){
      spawnSoulLight(s.x, s.y);
      explosionFlashes.push({ x: s.x, y: s.y, time: 0, maxTime: 1.0, color:'255,240,180', radius: 200, ring: true });
    }
  }
}

/* ============================== J. Combat =============================== */
function updateAttack(dt){
  attackIntensity = 0;
  if (enemy.dying || gameState !== 'playing'){ prevInAttackRange = false; return; }
  if (enemy.stunTimer > 0){ prevInAttackRange = false; return; }
  const dx = enemy.x - player.x, dy = enemy.y - player.y;
  const d = Math.hypot(dx, dy);
  // 与 enemyDamageToPlayer 完全一致：追猎者自身 atkRange × 全局范围倍率 × 难度偏差
  const h = HUNTERS[enemy.hunterType];
  const range = h.atkRange * enemyRangeMul * getBiasFactor();
  const inRange = d <= range;
  const justEntered = inRange && !prevInAttackRange;
  prevInAttackRange = inRange;
  if (!inRange) return;
  attackIntensity = 0.25 + (1 - d/range)*0.75;

  if (justEntered && player.counterWindow > 0 && player.charType === 'jing'){
    enemy.stunTimer = 3 + Math.random() * 5;
    enemy.vx = 0; enemy.vy = 0;
    player.counterWindow = 0;
    explosionFlashes.push({ x: player.x, y: player.y, time: 0, maxTime: 0.6, color:'255,220,180', radius: 200, ring: true });
    explosionFlashes.push({ x: enemy.x, y: enemy.y, time: 0, maxTime: 0.6, color:'255,180,220', radius: 150, ring: true });
  }

  const baseMul = HUNTERS[enemy.hunterType].baseDmgMul || 1.0;
  const smokeBonus = 1 + player.smokeStacks * SMOKE_DMG_BOOST;
  const dps = DMG_K/(d+25) * baseMul * smokeBonus;
  enemy.hp -= dps*dt;
  enemy.hitFlash = Math.min(1, enemy.hitFlash + dt*6);
  if (enemy.hp <= 0){ enemy.hp = 0; enemy.dying = true; enemy.deathTimer = 0; }
}
function enemyDamageToPlayer(dt){
  if (gameState !== 'playing' || enemy.dying) return;
  if (enemy.stunTimer > 0) return;
  const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
  const h = HUNTERS[enemy.hunterType];
  const atkRange = h.atkRange * enemyRangeMul * getBiasFactor();
  if (d > atkRange) return;
  const scale = 1.15 - 0.30*Math.min(1, d/atkRange);
  const dmg = ENEMY_ATK_BASE * scale * enemyDmgMul * getBiasFactor() * dt * (1 - player.damageReduction);
  player.hp -= dmg;
  if (enemy.huntProgress < 1) enemy.huntProgress = Math.min(1, enemy.huntProgress + dmg * 0.008);
}
function checkPlayerDeath(){
  if (gameState !== 'playing') return;
  if (player.hp <= 0){
    player.hp = 0; gameState = 'dead'; deathTimer = 0;
    setPanelVisible(false);
    document.getElementById('pauseBtn').classList.add('hidden');
  }
}
function checkWin(){
  let connected = 0;
  for (const s of snails) if (s.connectProgress >= 0.999 && s.hypnotized <= 0.5) connected++;
  if (connected >= WIN_COUNT){
    gameState = 'win'; winTimer = 0;
    setPanelVisible(false);
    document.getElementById('pauseBtn').classList.add('hidden');
  }
}
function updateFlashes(dt){
  for (let i=explosionFlashes.length-1; i>=0; i--){
    explosionFlashes[i].time += dt;
    if (explosionFlashes[i].time > explosionFlashes[i].maxTime) explosionFlashes.splice(i,1);
  }
}

let aiStuckTimer = 0, aiUnstuckTime = 0, aiUnstuckX = 0, aiUnstuckY = 0;
function updatePlayerAI(dt){
  aiTrySkills(dt);
  if (aiUnstuckTime > 0){
    aiUnstuckTime -= dt;
    aiInput.dx = aiUnstuckX; aiInput.dy = aiUnstuckY; aiInput.mag = 1;
    return;
  }
  let targetX = null, targetY = null, bestScore = -Infinity;
  for (const s of snails){
    if (s.connectProgress >= 0.999 || s.hypnotized > 0.5) continue;
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    const score = -d + s.connectProgress * 400;
    if (score > bestScore){ bestScore = score; targetX = s.x; targetY = s.y; }
  }
  if (targetX === null){ targetX = WORLD/2; targetY = WORLD/2; }
  let dirX = 0, dirY = 0;
  const eDist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
  if (eDist < 380){
    const ex = player.x - enemy.x, ey = player.y - enemy.y;
    const el = Math.hypot(ex, ey) || 1;
    const tx = targetX - player.x, ty = targetY - player.y;
    const tl = Math.hypot(tx, ty) || 1;
    dirX = (ex/el)*0.65 + (tx/tl)*0.35;
    dirY = (ey/el)*0.65 + (ty/tl)*0.35;
  } else {
    const tx = targetX - player.x, ty = targetY - player.y;
    const tl = Math.hypot(tx, ty) || 1;
    if (tl > 30){ dirX = tx/tl; dirY = ty/tl; }
  }
  for (const ob of obstacles){
    const dx = player.x - ob.x, dy = player.y - ob.y;
    const d = Math.hypot(dx, dy);
    const influence = ob.r + 100;
    if (d < influence && d > 0.001){
      const force = (influence - d) / influence;
      dirX += (dx/d) * force * 2.0;
      dirY += (dy/d) * force * 2.0;
    }
  }
  const M = 260;
  if (player.x < M) dirX += (M - player.x) / M * 5;
  if (player.x > WORLD - M) dirX -= (player.x - (WORLD - M)) / M * 5;
  if (player.y < M) dirY += (M - player.y) / M * 5;
  if (player.y > WORLD - M) dirY -= (player.y - (WORLD - M)) / M * 5;
  const l = Math.hypot(dirX, dirY);
  if (l > 0.05){ aiInput.dx = dirX/l; aiInput.dy = dirY/l; aiInput.mag = Math.min(1, l); }
  else { aiInput.dx = 0; aiInput.dy = 0; aiInput.mag = 0; }
  const spNow = Math.hypot(player.vx, player.vy);
  if (spNow < 40){
    aiStuckTimer += dt;
    if (aiStuckTimer > 0.9){
      const a = Math.random() * Math.PI * 2;
      aiUnstuckX = Math.cos(a); aiUnstuckY = Math.sin(a);
      aiUnstuckTime = 0.7; aiStuckTimer = 0;
    }
  } else aiStuckTimer = Math.max(0, aiStuckTimer - dt * 2);
}
function aiTrySkills(dt){
  const eDist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
  if (eDist < 260 && player.skillCd <= 0 && player.skillLock <= 0) useSkill();
  if (player.charSkillCd > 0 || player.skillLock > 0) return;
  const char = player.charType;
  if (char === 'su'){
    if (player.markerPlaced && eDist < 320) useCharSkill();
    else if (!player.markerPlaced && eDist > 500) useCharSkill();
  } else if (char === 'yin'){ if (eDist < 300) useCharSkill(); }
  else if (char === 'zhi'){
    let n = 0;
    for (const s of snails) if (Math.hypot(s.x-player.x, s.y-player.y) < SNAIL_CONNECT_RANGE && s.connectProgress < 0.999 && s.hypnotized < 0.5) n++;
    if (n >= 2) useCharSkill();
  } else if (char === 'xuan'){
    let n = 0;
    for (const s of snails) if (Math.hypot(s.x-player.x, s.y-player.y) < VORTEX_RADIUS && s.connectProgress < 0.999 && s.hypnotized < 0.5) n++;
    if (n >= 3) useCharSkill();
  } else if (char === 'wu'){
    if (eDist < 350) useCharSkill();
    if (eDist < 200) useKBlind();
  } else if (char === 'jing'){ if (eDist < 200) useCharSkill(); }
}

/* ============================== K. Camera =============================== */
function updateCam(dt){
  if (gameState === 'menu'){ cam.cx = WORLD/2; cam.cy = WORLD/2; cam.zoom += (0.2-cam.zoom)*Math.min(1,dt*3); return; }
  const midX = (player.x + enemy.x)/2, midY = (player.y + enemy.y)/2;
  const dx = Math.abs(player.x - enemy.x), dy = Math.abs(player.y - enemy.y);
  const needW = Math.max(900, dx + 560), needH = Math.max(900, dy + 560);
  let targetZoom = Math.min(W/needW, H/needH);
  targetZoom = clamp(targetZoom, 0.10, 1.35);
  const k = 1 - Math.exp(-4.5*dt);
  cam.cx += (midX - cam.cx)*k; cam.cy += (midY - cam.cy)*k;
  cam.zoom += (targetZoom - cam.zoom)*k;
  const vw = W/cam.zoom, vh = H/cam.zoom;
  view.w = vw; view.h = vh;
  view.l = cam.cx - vw/2; view.r = cam.cx + vw/2;
  view.t = cam.cy - vh/2; view.b = cam.cy + vh/2;
}

/* =========================== L. Sprite Textures ========================= */
function makeSprite(r,g,b){
  const S=64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.22, `rgba(${r},${g},${b},0.55)`);
  gr.addColorStop(0.55, `rgba(${r},${g},${b},0.16)`);
  gr.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0,0,S,S);
  return c;
}
const SPR_TRAIL_DEEP = makeSprite(26,64,220);
const SPR_TRAIL_CORE = makeSprite(120,210,255);

function createCoreTexture(){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const cx = S/2, cy = S/2;
  g.globalCompositeOperation = 'lighter';
  for (let arm=0; arm<5; arm++){
    const a0 = arm/5 * Math.PI*2;
    g.beginPath();
    for (let t=0; t<=1.001; t+=0.02){
      const a = a0 + t*3.9;
      const r = t*S*0.47;
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      if (t===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.strokeStyle = 'rgba(50,130,255,0.22)'; g.lineWidth = 7; g.stroke();
    g.strokeStyle = 'rgba(140,215,255,0.32)'; g.lineWidth = 2.4; g.stroke();
  }
  for (let i=0; i<240; i++){
    const a = Math.random()*Math.PI*2;
    const r = Math.pow(Math.random(),0.65) * S * 0.47;
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    const br = Math.random();
    g.fillStyle = `rgba(${110+br*110|0}, ${185+br*70|0}, 255, ${br*0.55})`;
    g.beginPath(); g.arc(x,y,0.5+Math.random()*1.9, 0, Math.PI*2); g.fill();
  }
  return c;
}
const CORE_TEX = createCoreTexture();

function createShadowTexture(){
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const cx = S/2, cy = S/2, R = S/2;
  let gr = g.createRadialGradient(cx, cy, R*0.55, cx, cy, R);
  gr.addColorStop(0.00, 'rgba(60,0,20,0.9)');
  gr.addColorStop(0.55, 'rgba(40,0,15,0.5)');
  gr.addColorStop(1.00, 'rgba(20,0,8,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();
  gr = g.createRadialGradient(cx, cy, R*0.35, cx, cy, R*0.65);
  gr.addColorStop(0.00, 'rgba(20,0,8,0.95)');
  gr.addColorStop(0.45, 'rgba(120,20,60,0.55)');
  gr.addColorStop(0.78, 'rgba(180,30,90,0.30)');
  gr.addColorStop(1.00, 'rgba(60,0,20,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R*0.72, 0, Math.PI*2); g.fill();
  gr = g.createRadialGradient(cx, cy, 0, cx, cy, R*0.45);
  gr.addColorStop(0.00, 'rgba(0,0,0,1)');
  gr.addColorStop(0.72, 'rgba(0,0,0,0.98)');
  gr.addColorStop(1.00, 'rgba(20,0,10,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R*0.48, 0, Math.PI*2); g.fill();
  return c;
}
const SHADOW_TEX = createShadowTexture();

const eye = { lookX:0, lookY:0, lookTX:0, lookTY:0, lookTimer:0 };
const bolts = [];
let boltTimer = 0;
function makeBolt(){
  const a0 = Math.random()*Math.PI*2;
  const dir = Math.random()<0.5 ? 1 : -1;
  const a1 = a0 + dir*(Math.PI*0.35 + Math.random()*Math.PI*0.55);
  const r0 = 0.06 + Math.random()*0.48;
  const r1 = 0.06 + Math.random()*0.48;
  const x0 = Math.cos(a0)*r0, y0 = Math.sin(a0)*r0;
  const x1 = Math.cos(a1)*r1, y1 = Math.sin(a1)*r1;
  const steps = 8 + Math.floor(Math.random()*8);
  const pts = [];
  const dx = x1-x0, dy = y1-y0;
  const len = Math.hypot(dx,dy) || 1;
  const px = -dy/len, py = dx/len;
  for (let i=0; i<=steps; i++){
    const t = i/steps;
    const off = (Math.random()-0.5)*0.42*Math.sin(t*Math.PI);
    pts.push([x0+dx*t+px*off, y0+dy*t+py*off]);
  }
  return { pts, life:0, maxLife:0.10+Math.random()*0.22, intensity:0.55+Math.random()*0.45 };
}
function updateBolts(dt){
  for (let i=bolts.length-1; i>=0; i--){
    bolts[i].life += dt;
    if (bolts[i].life > bolts[i].maxLife) bolts.splice(i,1);
  }
  boltTimer -= dt;
  if (boltTimer <= 0 && bolts.length < 3){
    boltTimer = 0.05 + Math.random()*0.18;
    bolts.push(makeBolt());
    if (Math.random() < 0.35) bolts.push(makeBolt());
  }
}
function updateEye(dt){
  eye.lookTimer -= dt;
  if (eye.lookTimer <= 0){
    eye.lookTimer = 0.7 + Math.random()*1.8;
    if (Math.random() < 0.62){
      const a = Math.random()*Math.PI*2, d = 0.12 + Math.random()*0.17;
      eye.lookTX = Math.cos(a)*d; eye.lookTY = Math.sin(a)*d;
    } else { eye.lookTX = 0; eye.lookTY = 0; }
  }
  const k = 1 - Math.exp(-5.5*dt);
  eye.lookX += (eye.lookTX - eye.lookX)*k;
  eye.lookY += (eye.lookTY - eye.lookY)*k;
  updateBolts(dt);
}

function makeSnailData(x, y, extra){
  const holes = [];
  for (let i=0; i<7; i++){
    const a = Math.random()*Math.PI*2, r = Math.random()*SNAIL_RADIUS*0.62;
    holes.push({ x:Math.cos(a)*r, y:Math.sin(a)*r, r:2.4+Math.random()*4.8, phase:Math.random()*Math.PI*2 });
  }
