    else { bgGrad.addColorStop(0, 'rgba(30,40,70,0.35)'); bgGrad.addColorStop(1, 'rgba(15,20,40,0.35)'); }
    ctx.fillStyle = bgGrad;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = isSel ? `rgba(${c.rim},0.95)` : 'rgba(90,120,180,0.3)';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.stroke();
    drawCharPreview(b, charIds[i], true);
  }

  // 角色信息框
  const ci = adjustCharInfoBounds();
  ctx.fillStyle = 'rgba(20,28,50,0.75)';
  ctx.beginPath(); ctx.roundRect(ci.x, ci.y, ci.w, ci.h, 10); ctx.fill();
  const cSel = CHARACTERS[selectedChar];
  ctx.strokeStyle = `rgba(${cSel.rim},0.7)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(ci.x, ci.y, ci.w, ci.h, 10); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.fillStyle = `rgba(${cSel.rim},1)`;
  ctx.font = 'bold 12px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText('角色 · ' + cSel.name + '  ' + cSel.sub, ci.x + 12, ci.y + 18);
  ctx.fillStyle = 'rgba(200,220,255,0.85)';
  ctx.font = '10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText('[' + cSel.skill.key + '] ' + cSel.skill.name, ci.x + 12, ci.y + 36);
  ctx.fillStyle = 'rgba(180,210,255,0.7)';
  const eff = cSel.skill.effect;
  if (eff.length > 22){ ctx.fillText(eff.slice(0,22), ci.x + 12, ci.y + 52); ctx.fillText(eff.slice(22), ci.x + 12, ci.y + 66); }
  else ctx.fillText(eff, ci.x + 12, ci.y + 52);
  ctx.fillStyle = 'rgba(140,200,255,0.75)';
  ctx.fillText('移速 ' + cSel.stats.speed + '   ·   CD ' + cSel.stats.cd + '   ·   HP ' + cSel.stats.hp, ci.x + 12, ci.y + 82);

  // 中间：三个地图图标
  const mapIds = ['void', 'night', 'buildings'];
  for (let i = 0; i < 3; i++){
    const b = adjustMapCardBounds(i);
    const id = mapIds[i];
    const isSel = selectedMapId === id;
    const m = MAP_DEFS[id];
    const bgGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    bgGrad.addColorStop(0, m.theme.bg0);
    bgGrad.addColorStop(1, m.theme.bg2);
    ctx.fillStyle = bgGrad;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();

    // 图标内容
    const mx = b.x + b.w/2, my = b.y + b.h/2;
    if (id === 'void'){
      // 石头
      ctx.beginPath();
      for (let j = 0; j <= 20; j++){
        const a = j/20 * Math.PI*2;
        const wob = 1 + Math.sin(a*4)*0.07 + Math.cos(a*7)*0.04;
        const rr = (b.w * 0.28) * wob;
        const px = mx + Math.cos(a)*rr, py = my + Math.sin(a)*rr;
        if (j===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const rg = ctx.createRadialGradient(mx - 8, my - 8, 3, mx, my, b.w*0.32);
      rg.addColorStop(0.0, '#5a6a86');
      rg.addColorStop(0.55, '#2a3448');
      rg.addColorStop(1.0, '#0a0e1c');
      ctx.fillStyle = rg; ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(${m.theme.accent},0.6)`;
      ctx.lineWidth = 1.6; ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (id === 'night'){
      // 黑暗效果
      ctx.fillStyle = 'rgba(0,0,4,0.92)';
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      const g1 = ctx.createRadialGradient(mx-12, my, 0, mx-12, my, b.w*0.30);
      g1.addColorStop(0, 'rgba(255,240,180,0.95)');
      g1.addColorStop(0.6, 'rgba(255,220,120,0.35)');
      g1.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(mx-12, my, b.w*0.30, 0, Math.PI*2); ctx.fill();
      const g2 = ctx.createRadialGradient(mx+14, my+4, 0, mx+14, my+4, b.w*0.40);
      g2.addColorStop(0, 'rgba(200,220,255,0.8)');
      g2.addColorStop(1, 'rgba(200,220,255,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(mx+14, my+4, b.w*0.40, 0, Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (id === 'buildings'){
      // 神坛
      ctx.globalCompositeOperation = 'lighter';
      const g3 = ctx.createRadialGradient(mx, my, 0, mx, my, b.w*0.40);
      g3.addColorStop(0, 'rgba(255,240,180,0.7)');
      g3.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g3;
      ctx.beginPath(); ctx.arc(mx, my, b.w*0.40, 0, Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      // 外圈柱
      const R = b.w * 0.30;
      for (let j = 0; j < 14; j++){
        if (j % 4 === 0) continue;
        const a = j/14 * Math.PI*2;
        const px = mx + Math.cos(a)*R;
        const py = my + Math.sin(a)*R;
        const rgg = ctx.createRadialGradient(px, py, 0, px, py, 5);
        rgg.addColorStop(0, '#5a5258');
        rgg.addColorStop(1, '#1a1418');
        ctx.fillStyle = rgg;
        ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,220,150,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      // 中央祭坛
      ctx.fillStyle = '#3a2e1c';
      ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,120,0.9)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,180,0.9)';
      ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI*2); ctx.fill();
    }

    // 选中描边
    ctx.strokeStyle = isSel ? `rgba(${m.theme.accent},0.95)` : 'rgba(90,120,180,0.35)';
    ctx.lineWidth = isSel ? 2.4 : 1;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    if (isSel){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(${m.theme.accent},0.6)`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4, 14); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    // 名字
    ctx.textAlign = 'center';
    ctx.fillStyle = isSel ? 'rgba(255,240,200,1)' : 'rgba(200,220,255,0.8)';
    ctx.font = 'bold 10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText(m.name, mx, b.y + b.h + 14);
    ctx.textAlign = 'left';
  }

  // 追猎者信息框
  const hi = adjustHunterInfoBounds();
  ctx.fillStyle = 'rgba(20,28,50,0.75)';
  ctx.beginPath(); ctx.roundRect(hi.x, hi.y, hi.w, hi.h, 10); ctx.fill();
  const hSel = HUNTERS[selectedHunter];
  ctx.strokeStyle = `rgba(${hSel.rim},0.7)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(hi.x, hi.y, hi.w, hi.h, 10); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.fillStyle = `rgba(${hSel.rim},1)`;
  ctx.font = 'bold 12px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText('追猎者 · ' + hSel.name + '  ' + hSel.sub, hi.x + 12, hi.y + 18);
  ctx.fillStyle = 'rgba(200,220,255,0.85)';
  ctx.font = '10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.fillText('[' + hSel.skill.key + '] ' + hSel.skill.name, hi.x + 12, hi.y + 34);

  // 追猎者数值：移速 / 伤害 / 尾流拖曳 / 攻击范围
  ctx.font = 'bold 10px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  const stats = [
    { label: '移速', value: hSel.moveSpd + '' },
    { label: '伤害', value: hSel.baseDmgMul.toFixed(2) + '×' },
    { label: '尾流拖曳', value: Math.round(hSel.maxSlow * 100) + '%' },
    { label: '攻击范围', value: hSel.atkRange + '' }
  ];
  const colW = (hi.w - 24) / 4;
  for (let i = 0; i < 4; i++){
    const sx = hi.x + 12 + i * colW;
    const sy = hi.y + 52;
    ctx.fillStyle = 'rgba(150,190,240,0.55)';
    ctx.font = '9px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText(stats[i].label, sx, sy);
    ctx.fillStyle = `rgba(${hSel.rim},1)`;
    ctx.font = 'bold 13px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
    ctx.fillText(stats[i].value, sx, sy + 18);
  }
  // 技能简述
  ctx.fillStyle = 'rgba(160,200,255,0.6)';
  ctx.font = '9px "ZCOOL KuaiLe", "Ma Shan Zheng", "Noto Serif SC", serif';
  const heff = hSel.skill.effect;
  if (heff.length > 26){ ctx.fillText(heff.slice(0,26), hi.x + 12, hi.y + 88); }
  else ctx.fillText(heff, hi.x + 12, hi.y + 88);

  // 下方：追猎者头像行
  const hIds = ['eclipse','crimson','pale','smoke','arachne'];
  for (let i = 0; i < 5; i++){
    const b = adjustHunterCardBounds(i);
    const isSel = selectedHunter === hIds[i];
    const h = HUNTERS[hIds[i]];
    const bgGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    if (isSel){ bgGrad.addColorStop(0, `rgba(${h.rim},0.30)`); bgGrad.addColorStop(1, `rgba(${h.rim},0.08)`); }
    else { bgGrad.addColorStop(0, 'rgba(30,40,70,0.35)'); bgGrad.addColorStop(1, 'rgba(15,20,40,0.35)'); }
    ctx.fillStyle = bgGrad;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = isSel ? `rgba(${h.rim},0.95)` : 'rgba(90,120,180,0.3)';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.stroke();
    drawHunterPreview(b, hIds[i], true);
  }
}

/* ============================== P. Main Loop ============================ */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  time += dt;
  if (hintAlpha > 0) hintAlpha -= dt*0.10;

  if (gameState === 'intro'){
    introTimer += dt;
    if (introTimer >= INTRO_DURATION) gameState = 'playing';
  } else if (gameState === 'playing'){
    readInput();
    distributeInput(dt);
    updateShadowPending();
    updateSnails(dt);
    updateSoulLight(dt);
    updateShadow(dt);
    updatePlayer(dt);
    updateEnemy(dt);
    updateFlashes(dt);
    updateSmokeProjectiles(dt);
    updateAttack(dt);
    enemyDamageToPlayer(dt);
    checkPlayerDeath();
    checkWin();
    spawnTrails(dt);
    spawnYinTrails(dt);
    decayTrails(dt);
  } else if (gameState === 'dead'){
    deathTimer += dt;
    updateSnails(dt);
    updateSoulLight(dt);
    updateFlashes(dt);
    decayTrails(dt*0.5);
  } else if (gameState === 'win'){
    winTimer += dt;
    updateSnails(dt);
    updateSoulLight(dt);
    updateFlashes(dt);
    decayTrails(dt*0.5);
  }

  if (gameState === 'playing'){
    const bEdge = keys['b'] && !prevBKey;
    if (bEdge) useShadowSkill();
  }
  prevVKey = keys['v'];
  prevBKey = keys['b'];

  updateCam(dt);
  updateEye(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);

  if (gameState === 'menu'){ drawMenu(); updateSkillBtn(); return; }

  drawBackgroundScreenSpace();

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.cx, -cam.cy);

  drawBoundsWorld();
  drawObstaclesWorld();
  drawTrailsWorld();
  drawMarkerWorld();
  drawVortexWorld();
  drawSnailsWorld();
  drawSnailBlackArcsWorld();
  drawSnailGreenArcsWorld();
  drawSmokeProjectilesWorld();
  drawSpiderlingsWorld();
  drawSoulLight();
  drawEnemyWorld();
  drawPlayerWorld();
  drawAttackArcsWorld();
  drawShadowWorld();
  drawExplosionFlashes();

  ctx.restore();

  drawNightDarkness();
  drawVignette();
  drawFogOverlay();
  drawUI();
  drawOffscreenSnailArrows();
  drawJoystick();

  if (gameState === 'intro') drawIntroScreen();
  else if (gameState === 'paused') drawPauseScreen();
  else if (gameState === 'dead') drawDeathScreen();
  else if (gameState === 'win') drawWinScreen();

  updateSkillBtn();
}
requestAnimationFrame(loop);
</script>
